/* ============ 2) UNA COMIDA: opciones ============ */
function aHtmlOpcion(e,sec,pr){
  var elegida = sel[sec.id] && sel[sec.id].r===e.r.id;
  var listo = e.faltan===0;
  var aviso="";
  if(!listo){ aviso='<div class="aflag no">Te falta: '+e.items.filter(function(i){return !i.ok;}).map(function(i){return esc(i.txt);}).join(", ")+'</div>'; }
  else if(!elegida && e.k>pr.maximo){ aviso='<div class="aflag no">No entra en lo que te queda del día</div>'; }
  else if(!elegida && e.k>pr.objetivo*1.15){ aviso='<div class="aflag alto">Alto para lo que te queda: ajustá porciones</div>'; }
  else if(listo){ aviso='<div class="aflag ok">'+CHK+' Tenés todo para armarlo</div>'; }
  var cls='aopc'+(elegida?' sel':'')+(listo?'':' no');
  return '<button type="button" class="'+cls+'" data-act="plato" data-sec="'+sec.id+'" data-rec="'+e.r.id+'">'+
    '<div class="aoprow">'+aHtmlPlato(e.items,false,listo)+
      '<div class="aopinfo">'+
        (e.r.g?'<span class="agusto">Gusto · con moderación</span>':'')+
        (elegida?'<span class="agusto" style="background:rgba(62,158,120,.25);color:var(--done-lt)">Elegido</span>':'')+
        '<b class="aname">'+esc(e.r.n)+'</b>'+
        '<div class="aopnum"><span class="avol tnum">'+(elegida?sel[sec.id].k:e.k)+'<small> kcal</small></span><span class="aprot tnum">'+(elegida?sel[sec.id].p:e.p)+' g prot</span><span class="amin tnum">'+e.r.m+' min</span></div>'+
      '</div>'+
      '<svg class="chev2" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>'+
    '</div>'+aviso+'</button>';
}

function pintarCom(){
  var sec=aSecDe(aSec), pr=aPresupuesto(sec.id), e0=sel[sec.id]&&!sel[sec.id].skip?sel[sec.id]:null, salteada=aEstado(sec.id)==="skip";
  var evs=aDelPool(sec.pool).map(aEval);
  var listas=evs.filter(function(e){return e.faltan===0;});
  var casi=evs.filter(function(e){return e.faltan===1;});
  var lejos=evs.filter(function(e){return e.faltan>=2;});
  var cerca=function(a,b){return Math.abs(a.k-pr.objetivo)-Math.abs(b.k-pr.objetivo);};
  listas.sort(cerca); casi.sort(cerca);
  lejos.sort(function(a,b){return a.faltan-b.faltan;});

  $("comKicker").textContent=(sec.int?"Intervalo opcional":"Comida")+" · "+sec.h;
  $("comNombre").textContent=sec.int?sec.n.replace("Intervalo de ","").replace(/^./,function(c){return c.toUpperCase();}):sec.n;
  $("comIcon").className="ic big i-"+sec.ic;
  $("comStats").innerHTML=
    '<div class="hot"><div class="k">Objetivo</div><div class="v tnum">'+aMiles(pr.objetivo)+'<small> kcal</small></div></div>'+
    '<div><div class="k">Podés armar</div><div class="v tnum">'+listas.length+'</div></div>'+
    '<div><div class="k">Te quedan hoy</div><div class="v tnum">'+aMiles(pr.restante)+'</div></div>';

  var h="";
  if(!sec.int && !e0 && !salteada){
    h+='<button type="button" class="skipbtn" data-act="skip" data-id="'+sec.id+'">Saltear esta comida</button>';
  }
  if(salteada){
    h+='<div class="asum" style="margin-top:12px">Salteaste esta comida. Sus calorías quedan para el resto del día.'+
       '<button type="button" class="abtn" style="margin-top:10px" data-act="unskip" data-id="'+sec.id+'">Incluirla de nuevo</button></div>';
  }
  if(e0){
    h+='<div class="aeleg"><span class="atck" style="position:static;flex:none">'+CHK+'</span>'+
       '<span style="flex:1;min-width:0"><b>'+esc(e0.n)+'</b><span class="tnum">'+e0.k+' kcal · '+e0.p+' g prot</span></span></div>';
  }
  if(sec.int){ h+='<p class="anota" style="margin:12px 2px 0">Es opcional: usalo solo si te da hambre antes de la próxima comida. Poco aporte de calorías, mucha saciedad, y así no picás snacks.</p>'; }
  if(!sec.int && pr.objetivo<sec.kcal*0.9 && !e0 && !salteada){
    h+='<div class="asum" style="margin-top:12px">Ya comiste más de lo previsto, así que el objetivo de esta comida bajó a <b>≈ '+aMiles(pr.objetivo)+' kcal</b>. Las opciones se ordenan por lo que mejor te entra.</div>';
  }
  if(aNTild()===0){
    h+='<div class="avacio">Primero tildá lo que tenés en casa y te armo opciones con eso.'+
       '<button type="button" class="abtn" style="margin-top:12px" data-act="irdesp">Ir a mi despensa</button></div>';
  } else {
    if(listas.length){
      h+='<div class="asub">Podés armarlo ahora · '+listas.length+'</div>';
      listas.slice(0,aMas[sec.id]?listas.length:A_MAXL).forEach(function(e){ h+=aHtmlOpcion(e,sec,pr); });
    } else {
      h+='<div class="avacio">Con lo que tenés no alcanza para armar esta comida. Mirá qué sumar:</div>';
    }
    var sug=aSugerir(sec.pool);
    if(sug.length){
      h+='<div class="asum">Sumando <b>'+sug.map(function(s){return esc(aCorto(AF[s.id].nom).toLowerCase());}).join('</b> o <b>')+'</b> se habilitan más opciones.</div>';
    }
    if(casi.length){
      h+='<div class="asub">Te falta 1 ingrediente · '+casi.length+'</div>';
      casi.slice(0,aMas[sec.id]?casi.length:2).forEach(function(e){ h+=aHtmlOpcion(e,sec,pr); });
    }
    var resto=aMas[sec.id]?0:(Math.max(0,listas.length-A_MAXL)+Math.max(0,casi.length-2)+lejos.length);
    if(aMas[sec.id]){
      if(lejos.length){ h+='<div class="asub">Necesitan más</div>'; lejos.forEach(function(e){ h+=aHtmlOpcion(e,sec,pr); }); }
      h+='<button type="button" class="reset" data-act="mas" data-sec="'+sec.id+'">Ver menos</button>';
    } else if(resto>0){
      h+='<button type="button" class="reset" data-act="mas" data-sec="'+sec.id+'">Ver '+resto+(resto===1?' opción':' opciones')+' más</button>';
    }
  }
  $("comCont").innerHTML=h;
}

/* resalta tiempos y temperaturas dentro de un paso */
function aTiempos(t){
  return t.replace(/(\d+(?:,\d+)?(?:\s?(?:a|–|-)\s?\d+)?\s?(?:minutos?|segundos?|horas?|°C))/g,'<span class="tm">$1</span>');
}
/* ============ 3) UN PLATO: ingredientes, cantidades, preparación ============ */
function pintarPla(){
  var sec=aSecDe(aPl.sec), pr=aPresupuesto(sec.id), c=aCalcPl(), rec=aPl.rec;
  var ya=sel[sec.id] && sel[sec.id].r===rec.id;
  $("plKicker").textContent=(sec.int?"Intervalo":sec.n)+" · "+(rec.g?"gusto":"plato")+" · "+rec.m+" min";
  $("plNombre").textContent=rec.n;
  $("plPill").textContent=sec.h;
  $("plPlato").innerHTML=aHtmlPlato(c.items,true,c.faltan===0);
  $("plStats").innerHTML=
    '<div class="hot"><div class="k">Calorías</div><div class="v tnum">'+c.k+'</div></div>'+
    '<div><div class="k">Proteína</div><div class="v tnum">'+c.p+'<small> g</small></div></div>'+
    '<div><div class="k">Carbos</div><div class="v tnum">'+c.c+'<small> g</small></div></div>';

  var h='<div class="seclabel" style="margin-top:6px"><span class="eyebrow">Ingredientes</span><span class="eyebrow" style="color:rgba(255,255,255,.3)">Ajustá las porciones</span></div><div class="ilist">';
  c.items.forEach(function(it,i){
    var f=it.f, st=aStepQ(f), base=rec.slots[i].alts[0].q;
    var tag = it.ok ? '' : '<span class="itag">Te falta</span>';
    h+='<div class="irow'+(it.ok?'':' no')+'">'+
      '<span class="ibox">'+aIc(f.ic)+'</span>'+
      '<span class="iname"><b>'+esc(aCorto(f.nom))+'</b><span class="tnum">'+aCant(f,it.q)+'</span></span>'+
      (it.ok ? (
        (it.mas?'<button type="button" class="iswap" data-act="alt" data-i="'+i+'" aria-label="Cambiar por otro alimento">'+
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l4 4-4 4M3 11V9a2 2 0 0 1 2-2h16M7 21l-4-4 4-4M21 13v2a2 2 0 0 1-2 2H3"/></svg></button>':'')+
        '<span class="istep"><button type="button" data-act="menos" data-i="'+i+'" aria-label="Menos"'+(it.q<=st+0.001?' disabled':'')+'>−</button>'+
        '<button type="button" data-act="mas1" data-i="'+i+'" aria-label="Más"'+(it.q>=base*3-0.001?' disabled':'')+'>+</button></span>'
      ) : tag)+
    '</div>';
  });
  h+='</div>';

  var hechos=Object.keys(aPasos).filter(function(k){return aPasos[k];}).length;
  h+='<div class="seclabel" style="margin-top:24px"><span class="lbl">Preparación</span><span class="lbl tnum" style="color:rgba(255,255,255,.4)">'+(hechos?hechos+' de ':'')+rec.steps.length+' pasos</span></div><div class="plist">';
  rec.steps.forEach(function(t,i){
    h+='<button type="button" class="pstep'+(aPasos[i]?' hecho':'')+'" data-act="paso" data-i="'+i+'" aria-pressed="'+(!!aPasos[i])+'">'+
       '<span class="pn">'+(aPasos[i]?CHK:(i+1))+'</span>'+
       '<span class="pbody">'+(t.h?'<b>'+esc(t.h)+'</b>':'')+'<span class="pdet">'+aTiempos(esc(t.d))+'</span></span></button>';
  });
  h+='</div><p class="anota" style="margin:2px 2px 0;font-size:11.5px;color:var(--muted)">Tocá cada paso para marcarlo mientras cocinás.</p>';

  /* presupuesto y acción */
  var otros=aConsumido(sec.id);
  var llevas=otros+c.k, quedan=A_KCAL-llevas;
  var nota, bloquea=false;
  if(c.faltan>0){ nota='<div class="aflag no" style="margin:0 0 10px">Te falta'+(c.faltan>1?'n '+c.faltan+' ingredientes':' 1 ingrediente')+' para armarlo. Tildalo en tu despensa.</div>'; bloquea=true; }
  else if(c.k>pr.maximo){ nota='<div class="aflag no" style="margin:0 0 10px">Con esto te pasás por '+(c.k-pr.maximo)+' kcal de lo que podés comer hoy. Bajá una porción.</div>'; bloquea=true; }
  else if(c.k>pr.objetivo*1.15){ nota='<div class="aflag alto" style="margin:0 0 10px">Es más de lo que te corresponde en esta comida (≈ '+aMiles(pr.objetivo)+' kcal). Lo que sumes acá se descuenta de las comidas que faltan.</div>'; }
  else { nota=''; }
  h+='<div class="plfoot">'+nota+
     '<div class="plbudget"><span>Con este plato llevás</span><b class="tnum">'+aMiles(llevas)+' <small>/ '+aMiles(A_KCAL)+' kcal</small></b></div>'+
     '<div class="abar" style="margin-top:8px"><i style="width:'+Math.min(100,Math.round(llevas/A_KCAL*100))+'%;background:'+(quedan<0?'var(--accent)':'linear-gradient(90deg,var(--accent),#FF6A60)')+'"></i></div>'+
     '<button type="button" class="bigbtn '+(bloquea?'gris':'roja')+'" data-act="add"'+(bloquea?' disabled':'')+'>'+
       (ya?'Guardar cambios':('Agregar '+A_AL[sec.id]))+'</button>'+
     (ya?'<button type="button" class="reset" data-act="quitar">Quitar '+A_DEL[sec.id]+'</button>':'')+
     '</div>';
  $("plCont").innerHTML=h;
}

/* ============ eventos ============ */
function aY(el){ return el.scrollTop; }
function aClick(ev){
  var b=ev.target.closest("[data-act]"); if(!b){return;}
  var a=b.getAttribute("data-act");

  /* --- hoja inferior, cierre del día, cortes --- */
  if(a==="sclose"){ aSheetCerrar(); return; }
  if(a==="info"){ aSheet(aHtmlInfo(b.getAttribute("data-id"))); return; }
  if(a==="fin"){ aSheet(aHtmlFin()); return; }
  if(a==="finok"){
    cerrado=true; aGuardarSel(); aSheetCerrar(); aTab="comidas"; pintarAli();
    aviso("Día guardado en Mi semana"); return;
  }
  if(a==="reabrir"){ cerrado=false; aGuardarSel(); pintarAli(); return; }
  if(a==="irsal"){ abrirSal(); return; }

  /* --- lista --- */
  if(a==="tab"){ aTab=b.getAttribute("data-t"); pintarAli(); aAlSegmento(); return; }
  if(a==="cat"){ aCat=b.getAttribute("data-id"); aQ=""; }
  else if(a==="tg"){
    var id=b.getAttribute("data-id");
    if(despensa[id]){ delete despensa[id]; } else { despensa[id]=1; }
    aGuardarDesp();
  }
  else if(a==="todos"){ aEnCat(aCat).forEach(function(i){ despensa[i]=1; }); aGuardarDesp(); }
  else if(a==="ning"){ aEnCat(aCat).forEach(function(i){ delete despensa[i]; }); aGuardarDesp(); }
  else if(a==="lim"){ despensa={}; aGuardarDesp(); }
  else if(a==="rst"){ sel={}; aGuardarSel(); }
  else if(a==="skip"){
    var sk=b.getAttribute("data-id"); sel[sk]={skip:true}; aGuardarSel();
    aTab="comidas"; pintarAli(); ir("ali"); aAlSegmento();
    aviso("Salteaste "+A_EL[sk]+" · sus calorías pasan al resto del día"); return;
  }
  else if(a==="unskip"){
    var us=b.getAttribute("data-id"); delete sel[us]; aGuardarSel();
    if(!$("vCom").hidden){ pintarCom(); return; }
  }
  else if(a==="skipall"){
    aPendientes().forEach(function(x){ sel[x.id]={skip:true}; }); aGuardarSel();
  }
  else if(a==="meal"){ aSec=b.getAttribute("data-id"); pintarCom(); ir("com"); return; }

  /* --- comida --- */
  else if(a==="volali"){ pintarAli(); ir("ali"); aAlSegmento(); return; }
  else if(a==="irdesp"){ aTab="despensa"; pintarAli(); ir("ali"); aAlSegmento(); return; }
  else if(a==="mas"){
    var s2=b.getAttribute("data-sec"); aMas[s2]=!aMas[s2];
    var y=aY($("vCom")); pintarCom(); $("vCom").scrollTop=y; return;
  }
  else if(a==="plato"){ aAbrirPlato(b.getAttribute("data-sec"),b.getAttribute("data-rec")); pintarPla(); ir("pla"); return; }

  /* --- plato --- */
  else if(a==="volcom"){ pintarCom(); ir("com"); return; }
  else if(a==="menos"||a==="mas1"){
    var i=+b.getAttribute("data-i"), f=AF[aPl.ids[i]], st=aStepQ(f), base=aPl.rec.slots[i].alts[0].q;
    var q=aPl.qs[i]+(a==="mas1"?st:-st);
    q=Math.round(q*1000)/1000;
    if(q<st-0.001){ q=st; }
    if(q>base*3){ q=base*3; }
    aPl.qs[i]=q;
    var y2=aY($("vPla")); pintarPla(); $("vPla").scrollTop=y2; return;
  }
  else if(a==="paso"){
    var pi=+b.getAttribute("data-i"); aPasos[pi]=!aPasos[pi];
    var y4=aY($("vPla")); pintarPla(); $("vPla").scrollTop=y4; return;
  }
  else if(a==="alt"){
    var j=+b.getAttribute("data-i"), sl=aPl.rec.slots[j];
    var disp=sl.alts.filter(function(x){ return despensa[x.id]; });
    var pos=0; disp.forEach(function(x,n){ if(x.id===aPl.ids[j]){ pos=n; } });
    var nx=disp[(pos+1)%disp.length];
    aPl.ids[j]=nx.id;
    var y3=aY($("vPla")); pintarPla(); $("vPla").scrollTop=y3; return;
  }
  else if(a==="add"){
    var c=aCalcPl();
    if(c.faltan>0){ return; }
    sel[aPl.sec]={r:aPl.rec.id,n:aPl.rec.n,k:c.k,p:c.p,ids:aPl.ids.slice(),qs:aPl.qs.slice()};
    aGuardarSel();
    aTab="comidas"; pintarAli(); ir("ali"); aAlSegmento();
    aviso("Agregado "+A_AL[aPl.sec]+" · "+c.k+" kcal");
    return;
  }
  else if(a==="quitar"){
    delete sel[aPl.sec]; aGuardarSel();
    aTab="comidas"; pintarAli(); ir("ali"); aAlSegmento(); return;
  }
  var yy=aY($("vAli")); pintarAli(); $("vAli").scrollTop=yy;
}
$("vAli").addEventListener("click",aClick);
$("vCom").addEventListener("click",aClick);
$("vPla").addEventListener("click",aClick);
$("aSheet").addEventListener("click",aClick);
$("vAli").addEventListener("input",function(ev){
  if(ev.target && ev.target.id==="aBuscar"){ aQ=ev.target.value; $("aDespBody").innerHTML=aHtmlDespBody();
    var bar=$("aliCont").querySelector(".acatbar"); if(bar){ Array.prototype.forEach.call(bar.querySelectorAll(".acatb"),function(x){ x.classList.toggle("sel",!aQ&&x.getAttribute("data-id")===aCat); }); } }
});


/* ============ 3) MI SEMANA (comida, de lunes a domingo) ============ */
var A_DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
var A_MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function aSemana(){
  var lun=aLunes(new Date()); lun.setDate(lun.getDate()+7*aSemOff);
  var hoy=aISO(new Date()), out=[];
  for(var i=0;i<7;i++){
    var d=new Date(lun.getFullYear(),lun.getMonth(),lun.getDate()+i), iso=aISO(d);
    var dat = iso===hoy ? aDiaHoy() : (hist[iso]||null);
    out.push({i:i,d:d,iso:iso,hoy:iso===hoy,fut:iso>hoy,dat:dat});
  }
  return out;
}
function aSalEst(x){
  if(!x.dat||x.dat.k<=0){ return "vacio"; }
  if(x.hoy&&!x.dat.c){ return "curso"; }
  return aEstDia(x.dat.k);
}
function aHtmlSal(){
  var dias=aSemana(), a=dias[0].d, z=dias[6].d;
  var rango=a.getDate()+(a.getMonth()!==z.getMonth()?" "+A_MES[a.getMonth()]:"")+" – "+z.getDate()+" "+A_MES[z.getMonth()];
  var cuentan=dias.filter(function(x){ return x.dat && x.dat.k>0 && (x.dat.c || (!x.hoy && !x.fut)); });
  var n=cuentan.length;
  var avK=n?Math.round(cuentan.reduce(function(s,x){return s+x.dat.k;},0)/n):0;
  var avP=n?Math.round(cuentan.reduce(function(s,x){return s+x.dat.p;},0)/n):0;
  var enObj=cuentan.filter(function(x){ return aEstDia(x.dat.k)==="ok"; }).length;
  var maxK=dias.reduce(function(m,x){ return Math.max(m,x.dat?x.dat.k:0); },0);
  var esc2=Math.max(A_KCAL*1.2,maxK*1.05);
  var h='<div class="snav"><button type="button" data-act="sprev" aria-label="Semana anterior">‹</button>'+
    '<div><b>'+(aSemOff===0?'Esta semana':(aSemOff===-1?'Semana pasada':'Hace '+(-aSemOff)+' semanas'))+'</b><span>'+rango+'</span></div>'+
    '<button type="button" data-act="snext" aria-label="Semana siguiente"'+(aSemOff>=0?' disabled':'')+'>›</button></div>';
  h+='<div class="sstats"><div><b class="tnum">'+(n?aMiles(avK):'–')+'</b><span>kcal por día</span></div>'+
     '<div><b class="tnum">'+(n?avP:'–')+'<small> g</small></b><span>proteína por día</span></div>'+
     '<div><b class="tnum">'+enObj+'<small>/'+n+'</small></b><span>días en objetivo</span></div></div>';
  h+='<div class="schart"><div class="sgrid"><div class="sline" style="bottom:'+(A_KCAL/esc2*100)+'%"><span class="tnum">'+aMiles(A_KCAL)+'</span></div></div><div class="sbars">';
  dias.forEach(function(x){
    var k=x.dat?x.dat.k:0, st=aSalEst(x);
    h+='<div class="sbar'+(x.hoy?' dhoy':'')+(x.fut?' fut':'')+'"><div class="sbc">'+
      (k>0?'<i class="'+st+'" style="height:'+Math.max(3,k/esc2*100)+'%"><b class="tnum">'+(k>=1000?(Math.round(k/100)/10).toString().replace(".",","):k)+(k>=1000?'k':'')+'</b></i>':'<u></u>')+
      '</div><span class="sl">'+A_DIAS[x.i].slice(0,2)+'</span></div>';
  });
  h+='</div></div><p class="anota sleg tnum"><span class="lg ok"></span>En objetivo <span class="lg alto"></span>Te pasaste <span class="lg bajo"></span>Muy abajo <span class="lg curso"></span>En curso</p>';
  h+='<div class="srows">';
  dias.forEach(function(x){
    var st=aSalEst(x), dt=x.dat, k=dt?dt.k:0, p=dt?dt.p:0;
    var abierto = aSalAb[x.iso]!==undefined ? aSalAb[x.iso] : (x.hoy&&aSemOff===0);
    var etiqueta = x.fut ? "Todavía no" : (x.hoy ? (dt&&dt.c?"Hoy · cerrado":"Hoy · en curso") : (!dt||k<=0 ? "Sin registro" : (dt.c?"Cerrado":"Sin cerrar")));
    var pk=Math.min(100,k/A_KCAL*100);
    h+='<div class="srow '+st+(x.hoy?' dhoy':'')+(x.fut?' fut':'')+(abierto?' open':'')+'">'+
      '<button type="button" class="sbtn" data-act="sdia" data-iso="'+x.iso+'" aria-expanded="'+abierto+'"'+(k<=0?' disabled':'')+'>'+
        '<span class="sdn"><b>'+A_DIAS[x.i]+' '+x.d.getDate()+'</b><span>'+etiqueta+'</span></span>'+
        '<span class="skv tnum">'+(k>0?aMiles(k):'–')+'<small> kcal</small></span>'+
        '<span class="spc tnum'+(k>0?(p>=A_PMIN?' ok':' bajo'):'')+'">'+(k>0?p+' g':'–')+'</span>'+
      '</button>'+
      (k>0?'<div class="spb"><i style="width:'+pk+'%"></i></div>':'')+
      '<div class="sdet">'+(dt&&dt.m&&dt.m.length?dt.m.map(function(m){ return '<div class="smeal"><span class="smn">'+esc(String(m.s).replace("Intervalo de ",""))+'</span><em>'+esc(m.n)+'</em><b class="tnum">'+aMiles(m.k)+'</b></div>'; }).join(""):'')+'</div>'+
    '</div>';
  });
  h+='</div><p class="anota" style="margin:18px 2px 8px;font-size:11.5px">La semana de comida va de lunes a domingo y arranca de cero cada lunes. Cerrá el día desde Alimentación para dejarlo guardado.</p>';
  return h;
}
function pintarSal(){ $("salCont").innerHTML=aHtmlSal(); }
function abrirSal(){ pararTimer(); aCheckDia(); aSemOff=0; aSalAb={}; pintarSal(); ir("sal"); aSheetCerrar(); }
$("vSal").addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]"); if(!b||b.disabled){ return; }
  var a=b.getAttribute("data-act"), y=$("vSal").scrollTop;
  if(a==="sprev"){ if(aSemOff>-52){ aSemOff--; aSalAb={}; } }
  else if(a==="snext"){ if(aSemOff<0){ aSemOff++; aSalAb={}; } }
  else if(a==="sdia"){
    var iso=b.getAttribute("data-iso"), cur=aSalAb[iso]!==undefined?aSalAb[iso]:(iso===aISO(new Date())&&aSemOff===0);
    aSalAb[iso]=!cur;
  }
  else { return; }
  pintarSal(); $("vSal").scrollTop=y;
});


  /* ---------- barra inferior ---------- */
  $("tabTrain").addEventListener("click",function(){
    pararTimer();
    var hi=hoyIndice();
    abrirDia(hi>=0?hi:diaIdx);
  });
  var tToast=null;
  function aviso(txt){
    var t=$("toast"); t.textContent=txt; t.classList.add("on");
    if(tToast){clearTimeout(tToast);}
    tToast=setTimeout(function(){t.classList.remove("on");},2600);
  }
  $("tabFood").addEventListener("click",function(){ abrirAli(); });
  $("tabUser").addEventListener("click",function(){ abrirSal(); });

  /* ---------- arranque ---------- */
  pintarSemana();
  setInterval(pintarSemana,30000);
  var hi=hoyIndice();
  diaIdx = hi>=0 ? hi : 0;
  abrirDia(diaIdx);
  ir("semana");
})();
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      /* si hay una versión nueva, se aplica sola la próxima vez que se abre la app */
      reg.addEventListener("updatefound",function(){
        var w=reg.installing; if(!w){return;}
        w.addEventListener("statechange",function(){ if(w.state==="installed" && navigator.serviceWorker.controller){ try{ sessionStorage.setItem("franco_upd","1"); }catch(e){} } });
      });
    }).catch(function(){});
  });
}
</script>
