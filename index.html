     "Pelar y servir|Pelá el huevo, cortalo en cuartos y ponelo arriba de la ensalada con pimienta."]},
 {p:"intervalo", n:"Pepino con queso fresco", m:5, s:["pepino:1",QSO(1)],
  t:["Cortar|Cortá el pepino en rodajas de medio centímetro, con cáscara si es tierna.",
     "Condimentar|Poné el queso en cubitos arriba con orégano, pimienta y unas gotas de limón.",
     "Comer|Servilo frío, recién cortado."]},
 {p:"intervalo", n:"Pochoclos caseros sin manteca", m:8, s:["pochoclo:1"],
  t:["Hacerlos en olla|En una olla tapada a fuego medio, sin aceite, poné los granos y sacudí la olla de vez en cuando. Cuando pasen 2 segundos entre un estallido y otro, apagá.",
     "Hacerlos en microondas|Alternativa: ponelos en un bowl tapado con un plato, 2 a 3 minutos, hasta que bajen los estallidos.",
     "Condimentar|Sumá sal fina o canela, y mezclá."]},
 {p:"intervalo", n:"Tostada con palta y tomate", m:6, s:[PAN(0.5),"palta:1","tomate:0.5"],
  t:["Tostar|Tostá media rebanada de pan hasta que quede crocante.",
     "Pisar la palta|Pisá la palta con sal, pimienta y limón, y extendela sobre la tostada.",
     "Terminar|Poné rodajas finas de tomate arriba con orégano."]},
 {p:"intervalo", n:"Manzana al horno con ricota", m:20, s:["manzana:1","ricota:1"],
  t:["Preparar la manzana|Sacale el centro con un cuchillo o descarozador, sin llegar a la base. Hacele un corte alrededor con la punta del cuchillo para que no reviente.",
     "Hornear|Ponela en una fuente con un dedo de agua, canela por dentro y horno moderado 15 a 20 minutos, hasta que esté tierna.",
     "Servir|Rellenala con la ricota, que se calienta con el calor de la fruta. Comela tibia."]},

 /* ---------- ALMUERZO ---------- */
 {p:"almuerzo", n:"Pollo al horno con papas y cebolla", m:70, s:[POLLO(1),PAPA(2),"cebolla:1",ENS(1),ACE],
  t:["Precalentar|Prendé el horno a temperatura media-fuerte (200 °C) 10 minutos antes.",
     "Cortar|Pelá las papas y cortalas en rodajas de 1 cm. Cortá la cebolla en aros gruesos.",
     "Condimentar|En una fuente, mezclá las papas y la cebolla con el aceite, sal, pimienta y pimentón. Condimentá el pollo con sal, ajo, orégano y pimentón y apoyalo arriba.",
     "Hornear|Cociná 40 a 45 minutos, dando vuelta las papas y el pollo a la mitad. El pollo está listo cuando, al pincharlo, el jugo sale transparente.",
     "Servir|Dejalo reposar 5 minutos, así queda jugoso. Servilo con la ensalada fresca aliñada con limón."]},
 {p:"almuerzo", n:"Puchero liviano", m:75, s:[CARNE(1),"papa:1","choclo:1","zanahoria:1",COC(1)],
  t:["Hervir la carne|Poné la carne en una olla con agua fría que la cubra, sal gruesa y una hoja de laurel. Llevala a hervor, espumá lo que sube y cociná tapado a fuego bajo 40 minutos.",
     "Sumar las verduras duras|Pelá la papa y la zanahoria y cortalas en trozos grandes. Cortá el choclo en ruedas. Agregalos a la olla y cociná 20 minutos más.",
     "Agregar la verdura|Sumá la verdura que elegiste en trozos grandes los últimos 8 a 10 minutos, para que no se deshaga.",
     "Servir|Sacá todo con espumadera, cortá la carne en fetas y servilo con un cucharón del caldo desgrasado. Probá de sal al final."]},
 {p:"almuerzo", n:"Pastel de papa liviano", m:60, s:["picada:1","papa:2","huevo:1","cebolla:1",ENS(1)],
  t:["Hervir las papas|Pelá las papas, cortalas en trozos y hervilas 20 minutos hasta que estén bien tiernas. Hacé un puré con un poco del agua de cocción, sin manteca, con sal y nuez moscada.",
     "Hervir el huevo|Hervilo 9 minutos aparte, pelalo y picalo.",
     "Hacer el relleno|Rehogá la cebolla picada en una sartén con unas gotas de aceite hasta que esté transparente. Sumá la carne picada y cociná 8 minutos, desmenuzándola. Condimentá con comino, pimentón, sal y pimienta.",
     "Armar|En una fuente, poné el relleno, el huevo picado arriba y cubrí con el puré, alisándolo con un tenedor.",
     "Gratinar|Horno fuerte 10 a 15 minutos, hasta que el puré se dore. Servilo con la ensalada."]},
 {p:"almuerzo", n:"Zapallitos rellenos con carne y arroz", m:50, s:["zapallito:1.5","picada:1","arroz:1",QSO(1),ACE],
  t:["Preparar los zapallitos|Hervilos enteros 8 minutos en agua con sal. Cortalos al medio a lo largo y ahuecalos con una cucharita; guardá la pulpa.",
     "Hacer el relleno|Rehogá cebolla en el aceite, sumá la carne picada y cociná 8 minutos. Agregá la pulpa picada, el arroz cocido, sal, pimienta y orégano.",
     "Rellenar|Llená cada mitad con el relleno bien apretado. Poné el queso arriba.",
     "Gratinar|Horno fuerte 15 a 20 minutos, hasta que el queso burbujee y se dore."]},
 {p:"almuerzo", n:"Revuelto gramajo liviano", m:25, s:["papa:2","Fiambre=jamon:2|paleta:2|crudo:2|lomito:3","huevo:2","cebolla:1",ACE],
  t:["Cocinar la papa|Pelá la papa, cortala en cubitos de 1 cm y hervila 8 minutos, hasta que esté tierna pero firme. Escurrila bien.",
     "Dorar|En una sartén grande con el aceite, a fuego medio, dorá la papa 5 minutos moviéndola. Sumá la cebolla en juliana y cociná 3 minutos más.",
     "Sumar el jamón|Agregá el jamón en tiritas y mezclá 1 minuto.",
     "Cuajar los huevos|Batí los huevos con sal y pimienta, volcalos en la sartén y revolvé a fuego bajo hasta que cuajen pero sigan húmedos.",
     "Servir|Servilo enseguida, con perejil picado si tenés."]},
 {p:"almuerzo", n:"Pollo con arroz y verduras", m:35, s:[POLLO(1),"arroz:2",COC(1),ACE],
  t:["Cocinar el arroz|Hervilo en abundante agua con sal, el tiempo del paquete (en general 12 a 15 minutos). Escurrilo y dejalo tapado.",
     "Dorar el pollo|Cortá la pechuga en dos filetes finos para que se cocine parejo. Condimentá con sal, pimienta y orégano. En sartén caliente con la mitad del aceite, cociná 5 a 6 minutos de cada lado, hasta que no quede rosado.",
     "Hacer las verduras|Salteá la verdura en la misma sartén 4 a 5 minutos, o hervila al dente.",
     "Servir|Armá el plato con el arroz, el pollo en fetas y las verduras. Terminá con el resto del aceite crudo."]},
 {p:"almuerzo", n:"Fideos con carne picada y salsa", m:30, s:["fideos:1.75","picada:1","salsa:1",ENS(1),"rallado:1"],
  t:["Hervir los fideos|Cociná los fideos al dente en agua con sal, 1 minuto menos de lo que indica el paquete. Guardá media taza del agua de cocción.",
     "Hacer la salsa|En una sartén, rehogá cebolla y ajo, sumá la carne picada y cociná 8 minutos desmenuzándola. Agregá la salsa de tomate, orégano y albahaca y cociná 10 minutos a fuego bajo.",
     "Mezclar|Sumá los fideos escurridos a la salsa, con un chorrito del agua de cocción, y mezclá 1 minuto.",
     "Servir|Rallá el queso por arriba y acompañá con la ensalada."]},
 {p:"almuerzo", n:"Guiso de lentejas con carne y arroz", m:60, s:["lentejas:1.75","carne:0.75","arroz:1",COC(1)],
  t:["Cocinar las lentejas|Si usás secas, remojalas 1 hora y hervilas 25 a 30 minutos. Si son de lata, enjuagalas bien.",
     "Dorar la carne|Cortá la carne en cubos chicos y dorala en una olla con unas gotas de aceite, con cebolla, morrón y ajo picados.",
     "Guisar|Agregá las lentejas, la verdura, pimentón, comino, laurel y agua o caldo hasta cubrir. Cociná tapado a fuego bajo 20 minutos.",
     "Servir|Servilo con el arroz al costado. Si queda muy líquido, destapá los últimos 5 minutos."]},
 {p:"almuerzo", n:"Merluza con papas y verduras", m:40, s:["merluza:1",PAPA(2),ENS(1),ACE,COC(1)],
  t:["Hornear las papas|Cortalas en rodajas de 1 cm, condimentalas con sal y la mitad del aceite y horneá a 200 °C 20 minutos.",
     "Preparar la merluza|Secá los filetes con papel, salpimentá y pasalos con limón y un poco de aceite.",
     "Hornear el pescado|Sumá la merluza a la fuente y cociná 12 a 15 minutos, hasta que se desarme fácil con un tenedor.",
     "Hacer las verduras|Salteá o hervila la verdura cocida 5 minutos.",
     "Servir|Armá el plato con la ensalada fresca al costado."]},
 {p:"almuerzo", n:"Carne magra con batata y verduras", m:35, s:[CARNE(1),"batata:1.75",ENS(1),ACE,COC(1)],
  t:["Hacer la batata|Cortala en gajos con cáscara, aceitala apenas y horneala a 200 °C 25 a 30 minutos, dándola vuelta una vez.",
     "Sellar la carne|Sacá la carne de la heladera 15 minutos antes. Secala, salpimentala y cocinala en sartén bien caliente 3 a 4 minutos por lado.",
     "Reposar|Dejá reposar la carne 3 minutos tapada con papel de aluminio antes de cortarla.",
     "Verduras y ensalada|Salteá o hervila la verdura y armá la ensalada con el resto del aceite y limón."]},
 {p:"almuerzo", n:"Ensalada de atún, arroz y huevo", m:25, s:["atun:1","arroz:1.5","huevo:2",ENS(1.5),ACE],
  t:["Hervir los huevos|9 minutos desde que rompe el hervor y agua fría después.",
     "Enfriar el arroz|Usá arroz cocido y frío, o cocinalo y enfrialo bajo el chorro de agua.",
     "Armar la base|En un bowl grande, mezclá el arroz con la verdura cortada.",
     "Sumar proteína|Escurrí bien el atún, desmenuzalo y agregalo con los huevos picados.",
     "Aliñar|Condimentá con el aceite, limón, sal y pimienta justo antes de comer."]},
 {p:"almuerzo", n:"Garbanzos con pollo y verduras", m:30, s:["garbanzos:1.75",POLLO(0.75),COC(1),ACE],
  t:["Cortar el pollo|Cortalo en cubos de 2 cm y condimentá con comino, pimentón, sal y pimienta.",
     "Dorar|En sartén grande con el aceite, a fuego fuerte, cociná el pollo 5 minutos moviéndolo hasta que dore.",
     "Sumar la verdura|Agregá la verdura en trozos y cociná 4 minutos más.",
     "Garbanzos|Sumá los garbanzos escurridos y enjuagados con medio vaso de agua. Cociná 5 a 8 minutos a fuego medio hasta que el líquido reduzca."]},
 {p:"almuerzo", n:"Tortilla de papa, verdura y queso", m:30, s:["huevo:3","papa:1.5",COC(1),QSO(1),ACE],
  t:["Cocinar la papa|Pelala y cortala en rodajas finas. Hervila 8 minutos hasta que esté tierna y escurrila.",
     "Saltear la verdura|En una sartén antiadherente con el aceite, salteá la verdura 4 minutos.",
     "Mezclar|En un bowl, batí los huevos con sal y pimienta y mezclalos con la papa, la verdura y el queso en cubos.",
     "Cuajar|Volcá todo en la sartén a fuego bajo, tapá y cociná 6 a 7 minutos.",
     "Dar vuelta|Ayudate con un plato grande: dalá vuelta la tortilla y cociná 4 minutos más del otro lado."]},
 {p:"almuerzo", n:"Cerdo magro con arroz y verduras", m:40, s:["cerdo:1","arroz:2",COC(1),ACE],
  t:["Preparar el cerdo|Cortá el lomo en fetas de 1,5 cm, salpimentá con ajo y orégano.",
     "Cocinar el arroz|Hervilo según el paquete y escurrilo.",
     "Sellar|En sartén caliente con el aceite, cociná el cerdo 4 a 5 minutos de cada lado, hasta que esté dorado y bien cocido por dentro.",
     "Verduras|Salteá la verdura 5 minutos en la misma sartén.",
     "Servir|Armá el plato con arroz, cerdo y verduras."]},
 {p:"almuerzo", n:"Quinoa con pollo y verduras", m:35, s:["quinoa:2",POLLO(1),COC(1),ACE],
  t:["Cocinar la quinoa|Enjuagala bien bajo el agua y hervila 12 a 15 minutos hasta que se abra el anillito. Escurrila.",
     "Hacer el pollo|Cortá la pechuga en tiras, salpimentá y cociná 5 minutos en sartén caliente con unas gotas de aceite.",
     "Saltear la verdura|Cociná la verdura 4 minutos.",
     "Mezclar|Juntá todo en la sartén con el resto del aceite y salteá 2 minutos."]},
 {p:"almuerzo", n:"Polenta con carne picada y salsa", m:35, s:["polenta:2","picada:1","salsa:1",ENS(1),QSO(1)],
  t:["Hacer la polenta|Poné agua con sal a hervir. Volcá la harina de maíz en lluvia revolviendo con cuchara de madera y cociná 3 a 5 minutos hasta que espese.",
     "Hacer la salsa|Rehogá cebolla, sumá la carne picada y cociná 8 minutos. Agregá la salsa de tomate y condimentos y cociná 10 minutos.",
     "Servir|Servila en un plato hondo con la salsa por arriba y el queso en cubos.",
     "Ensalada|Acompañá con la ensalada aliñada con limón."]},
 {p:"almuerzo", n:"Guiso de porotos con carne", m:60, s:["porotos:1.75",CARNE(0.75),COC(1),ACE],
  t:["Dorar|Cortá la carne en cubos y dorala en una olla con el aceite.",
     "Sofreír|Sumá cebolla, morrón y ajo picados y cociná 5 minutos.",
     "Guisar|Agregá los porotos cocidos, pimentón, comino, laurel y agua o caldo hasta cubrir.",
     "Cocinar|Tapá y cociná a fuego bajo 20 a 25 minutos.",
     "Servir|Retirá el laurel y servilo bien caliente."]},
 {p:"almuerzo", n:"Ensalada de caballa con papa y huevo", m:30, s:["caballa:1","papa:2","huevo:1",ENS(1.5),ACE],
  t:["Hervir|Hervi la papa en cubos (12 minutos) y el huevo (9 minutos) juntos, en ollas separadas.",
     "Enfriar|Dejá entibiar la papa y el huevo unos minutos.",
     "Armar|Mezclá la papa con la verdura y desmenuzá la caballa escurrida arriba.",
     "Terminar|Sumá el huevo picado y aliñá con el aceite, limón, sal y pimienta."]},
 {p:"almuerzo", n:"Arroz con pollo, morrón y arvejas", m:45, s:[POLLO(1),"arroz:1.5","morron:1","cebolla:1","arvejas:1",ACE],
  t:["Sellar el pollo|Cortá el pollo en cubos y dorá en una olla ancha con el aceite 5 minutos. Retiralo.",
     "Hacer el sofrito|En la misma olla rehogá la cebolla y el morrón picados 5 minutos con ajo, pimentón y comino.",
     "Cocinar con el arroz|Sumá el arroz crudo (o ya cocido si lo tenés), el pollo y agua caliente al doble del volumen del arroz. Cociná tapado a fuego bajo 15 a 18 minutos.",
     "Arvejas|Agregá las arvejas los últimos 5 minutos.",
     "Reposar|Apagá el fuego y dejá tapado 5 minutos."]},
 {p:"almuerzo", n:"Milanesas de pollo al horno con puré de zapallo", m:45, s:[POLLO(1),"huevo:1","panrallado:1","zapallo:2","papa:1",ROC,ENS(1)],
  t:["Preparar el pollo|Cortá la pechuga en dos filetes finos y golpealos con un palo de amasar para emparejar el espesor.",
     "Rebozar|Batí el huevo con sal, ajo y perejil. Pasá los filetes por el huevo y después por el pan rallado, presionando.",
     "Hornear|Ponelas en una placa aceitada con el rocío o unas gotas de aceite. Horno fuerte (220 °C), 12 minutos de cada lado, hasta que estén doradas.",
     "Hacer el puré|Hervi el zapallo y la papa 18 a 20 minutos hasta que estén tiernos. Pisá con un poco de agua de cocción, sal y nuez moscada.",
     "Servir|Armá el plato con la milanesa, el puré y la ensalada al costado."]},
 {p:"almuerzo", n:"Berenjenas rellenas con carne y muzzarella", m:50, s:["berenjena:2","picada:1","muzza:1","salsa:1","arroz:1"],
  t:["Hornear las berenjenas|Cortalas al medio a lo largo, hacele cortes en la pulpa y horneá a 200 °C 20 minutos, hasta que estén blandas.",
     "Hacer el relleno|Rehogá cebolla, sumá la carne picada y cociná 8 minutos. Agregá la pulpa de la berenjena picada, la salsa y el arroz cocido.",
     "Rellenar|Llená las cáscaras con el relleno y poné la muzzarella arriba.",
     "Gratinar|Horno fuerte 10 a 12 minutos, hasta que el queso se dore."]},
 {p:"almuerzo", n:"Crema de zapallo con pollo y tostadas", m:40, s:["zapallo:2",POLLO(1),"cebolla:1","rallado:1",PAN(1),ACE],
  t:["Hacer la crema|Rehogá la cebolla en el aceite, sumá el zapallo en cubos y agua o caldo hasta cubrirlo. Cociná 20 minutos hasta que esté muy tierno y procesalo con licuadora de mano.",
     "Cocinar el pollo|Aparte, cociná la pechuga en cubos en sartén con sal, pimienta y pimentón, 6 a 7 minutos.",
     "Tostadas|Tostá el pan hasta que quede crocante.",
     "Servir|Poné la crema en un plato hondo, el pollo arriba y el queso rallado. Mojá las tostadas."]},
 {p:"almuerzo", n:"Pascualina casera con ensalada", m:60, s:["tapa_tarta:1","espinaca:2","huevo:2","ricota:1.5","cebolla:1",ENS(1)],
  t:["Hacer el relleno|Hervi la espinaca 3 minutos, escurrila apretando bien y picala. Rehogá la cebolla y mezclala con la espinaca y la ricota. Salpimentá y sumá nuez moscada.",
     "Armar la tarta|Forrá un molde con la tapa de tarta, volcá el relleno y hacé dos huecos donde rompés los huevos enteros.",
     "Hornear|Cubrí con otra tapa si tenés, o dejala abierta. Horno 200 °C, 30 a 35 minutos hasta que dore.",
     "Servir|Cortá una porción grande y servila con la ensalada."]},
 {p:"almuerzo", n:"Bife a la plancha con puré mixto", m:40, s:[CARNE(1),"papa:1.5","zapallo:1",ENS(1),ACE],
  t:["Hacer el puré|Hervi la papa y el zapallo en trozos 18 minutos y pisalos con un poco de agua de cocción, sal y nuez moscada.",
     "Preparar el bife|Sacalo de la heladera 15 minutos antes y secalo. Salpimentalo recién antes de cocinar.",
     "Cocinar|En una plancha o sartén muy caliente con unas gotas de aceite, 3 a 4 minutos de cada lado para un punto jugoso.",
     "Reposar y servir|Dejá reposar 3 minutos y servilo con el puré y la ensalada aliñada con el resto del aceite."]},
 {p:"almuerzo", n:"Tirabuzones con pollo, brócoli y queso rallado", m:30, s:["fideos:1.5",POLLO(1),"brocoli:1","rallado:1",ACE],
  t:["Hervir|Cociná los fideos al dente. En los últimos 3 minutos, sumá el brócoli en arbolitos al mismo agua. Escurrí.",
     "Cocinar el pollo|Cortá el pollo en tiras, salpimentá y salteá en sartén 5 a 6 minutos con el aceite y ajo.",
     "Mezclar|Sumá los fideos y el brócoli a la sartén, revolvé 1 minuto y servilo con queso rallado arriba."]},
 {p:"almuerzo", n:"Salmón al horno con papas y verduras", m:40, s:["salmon:1","papa:1.5",COC(1),ACE],
  t:["Hornear las papas|Cortalas en rodajas, condimentalas con el aceite y horneá a 200 °C 20 minutos.",
     "Condimentar el salmón|Salpimentá y poné limón y eneldo si tenés.",
     "Hornear el salmón|Sumalo a la fuente y cociná 12 a 15 minutos, hasta que se desarme con el tenedor.",
     "Verduras|Hervi la verdura 5 minutos y servila con todo."]},
 {p:"almuerzo", n:"Langostinos salteados con arroz y verduras", m:25, s:["langostinos:1","arroz:1.5",COC(1),ENS(1),ACE],
  t:["Cocinar el arroz|Hervilo según el paquete y escurrilo.",
     "Saltear los langostinos|En sartén bien caliente con el aceite y ajo picado, cocinalos 2 minutos de cada lado, hasta que estén rosados.",
     "Verduras|Salteá las verduras 4 minutos con sal y limón.",
     "Servir|Mezclá con el arroz, y acompañá con la ensalada."]},
 {p:"almuerzo", n:"Asado con ensalada y papa", m:90, s:["Corte=asado:1.25|vacio:1|entrana:1|matambre:1|costillitas:1",ENS(1.5),"papa:1",ACE], g:1,
  t:["Preparar el fuego|Prendé las brasas con 40 minutos de anticipación: tienen que estar cubiertas de ceniza gris.",
     "Preparar la carne|Sacá la grasa visible de los cortes y salalos justo antes de ponerlos en la parrilla.",
     "Cocinar|A fuego medio y parrilla alta, cociná 25 a 30 minutos, dando vuelta una sola vez.",
     "Papa|Envolvé la papa en papel de aluminio y ponela en las brasas 40 a 45 minutos.",
     "Ensalada y servir|Armá una ensalada grande con el aceite, limón y sal, y comé despacio."]},
 {p:"almuerzo", n:"Milanesas al horno con papa y ensalada", m:35, s:["milanesa:2","papa:1.5",ENS(1)], g:1,
  t:["Precalentar|Horno fuerte 220 °C.",
     "Hornear|Ponelas en una placa con rocío de aceite y cociná 10 a 12 minutos de cada lado, hasta que dore.",
     "Papa|Hervi la papa 18 minutos y servila en puré o en cubos.",
     "Servir|Con limón y la ensalada al costado."]},
 {p:"almuerzo", n:"Tarta de verduras con ensalada", m:20, s:["tarta:2",ENS(1.5)], g:1,
  t:["Recalentar|Calentá la tarta 10 minutos en horno moderado para que la masa quede crocante.",
     "Servir|Servila con la ensalada grande."]},
 {p:"almuerzo", n:"Choripán con ensalada", m:30, s:["chorizo:1","frances:1",ENS(1.5)], g:1,
  t:["Cocinar el chorizo|Pinchalo con un tenedor y cocinalo a la parrilla o en sartén a fuego medio 15 a 20 minutos, dándolo vuelta, hasta que esté bien cocido.",
     "Armar|Abrí el pan, tostalo apenas y poné el chorizo adentro, abierto por la mitad.",
     "Chimichurri|Mezclá perejil, ajo, orégano, ají molido, vinagre y un chorrito de aceite. Una cucharadita alcanza.",
     "Servir|Acompañalo con una ensalada grande."]},
 {p:"almuerzo", n:"Ñoquis con salsa y pollo", m:35, s:["noquis:2","salsa:1.5","rallado:1",POLLO(1)], g:1,
  t:["Hervir los ñoquis|En agua con sal. Están listos cuando suben a la superficie (2 a 3 minutos).",
     "Hacer la salsa|Rehogá ajo y cebolla, sumá la salsa de tomate y cociná 10 minutos con albahaca.",
     "Cocinar el pollo|Hacelo a la plancha en tiras 5 a 6 minutos.",
     "Servir|Mezclá los ñoquis con la salsa, sumá el pollo y el queso rallado."]},
 {p:"almuerzo", n:"Empanadas caseras de carne al horno", m:60, s:["tapa_emp:1","picada:1","cebolla:1","huevo:1","aceitunas:1",ENS(1)], g:1,
  t:["Hacer el relleno|Rehogá la cebolla, sumá la carne picada, comino, pimentón y ají molido y cociná 8 minutos. Dejá enfriar.",
     "Agregar|Sumá el huevo duro picado y las aceitunas.",
     "Armar|Poné una cucharada de relleno en cada tapa y cerrá con repulgue.",
     "Hornear|Horno fuerte, 15 a 20 minutos, hasta que estén doradas.",
     "Servir|Con ensalada."]},

 /* ---------- MERIENDA ---------- */
 {p:"merienda", n:"Tostado de jamón y queso con café con leche", m:10, s:[PAN(1),"Fiambre=jamon:1|paleta:1|crudo:1|pavita:1.5|lomito:1.5",QSO(1),LECHE],
  t:["Armar el tostado|Poné el queso sobre una rebanada de pan, sumá el jamón doblado y cerrá con la otra rebanada. Apretalo apenas.",
     "Dorar|Calentá una sartén antiadherente a fuego medio-bajo, sin aceite. Cociná el tostado 2 a 3 minutos por lado con la sartén tapada, hasta que el queso se derrita y el pan esté bien dorado.",
     "Café con leche|Calentá la leche sin que hierva y mezclala con el café, sin azúcar o con edulcorante.",
     "Servir|Cortá el tostado en diagonal y comelo caliente, antes de que el queso se endurezca."]},
 {p:"merienda", n:"Tostadas con queso untable y mermelada, café con leche", m:8, s:[PAN(1),"untable:2",MERM,LECHE],
  t:["Tostar|Tostá las rebanadas hasta que estén bien doradas: así aguantan el untable sin ablandarse.",
     "Untar|Poné el queso en capa pareja hasta los bordes y, arriba, una cucharada de mermelada light.",
     "Café con leche|Calentá la leche y mezclala con el café.",
     "Servir|Comé las tostadas con el café con leche caliente, sin apuro."]},
 {p:"merienda", n:"Tostadas con ricota y fruta, café con leche", m:8, s:[PAN(1),"ricota:1",FRUTA,LECHE],
  t:["Condimentar la ricota|Pisá la ricota con un tenedor y mezclala con una pizca de sal y, si querés, una gota de esencia de vainilla o canela.",
     "Tostar|Tostá el pan hasta que esté dorado.",
     "Armar|Untá la ricota con generosidad y poné la fruta cortada en rodajas finas arriba.",
     "Café con leche|Calentá la leche, mezclala con el café y servilo todo junto."]},
 {p:"merienda", n:"Yogur con avena, frutillas y frutos secos", m:6, s:[YOG,"avena:1","frutillas:1",NUEZ],
  t:["Mezclar|Poné el yogur en un bowl y mezclalo con la avena. Dejalo 3 minutos para que la avena se hidrate.",
     "Cortar la fruta|Lavá las frutillas, sacales el cabito y cortalas en láminas.",
     "Picar los frutos secos|Picalos grueso con el cuchillo.",
     "Armar|Poné las frutillas sobre el yogur y los frutos secos al final, para que queden crocantes."]},
 {p:"merienda", n:"Licuado proteico de banana", m:4, s:[LECHE,"proteina:1","banana:1"],
  t:["Cargar|Poné la leche fría primero, luego la banana en trozos y la proteína en polvo.",
     "Licuar|Licuá 40 segundos con 3 o 4 cubos de hielo, hasta que quede sin grumos y espumoso.",
     "Tomarlo|Servilo en vaso alto y tomalo enseguida. Si querés comer algo sólido, sumá 1 fruta."]},
 {p:"merienda", n:"Sándwich de pavita, queso y verduras", m:8, s:[PAN(1),"pavita:1.5",QSO(1),ENS(1)],
  t:["Preparar la verdura|Lavá y secá bien las hojas y cortá el tomate en rodajas finas: si quedan mojadas, ablandan el pan.",
     "Tostar apenas|Pasá el pan 1 minuto por la tostadora, solo para que tome firmeza.",
     "Armar|Poné el queso sobre una rebanada, después la pavita y las verduras arriba, con sal y pimienta.",
     "Cerrar y cortar|Tapá con la otra rebanada, apretá suave y cortalo en diagonal."]},
 {p:"merienda", n:"Tostadas con palta y huevo", m:12, s:[PAN(1),"palta:1","huevo:2"],
  t:["Hervir los huevos|Poné los huevos en agua fría, llevá a hervor y contá 9 minutos. Pasalos por agua fría y pelalos.",
     "Pisar la palta|Pisala con un tenedor con sal, pimienta y unas gotas de limón, para que no se ponga marrón.",
     "Tostar|Tostá el pan hasta que esté firme.",
     "Armar|Extendé la palta sobre las tostadas y poné arriba los huevos en rodajas, con pimienta y ají molido."]},
 {p:"merienda", n:"Ricota con fruta y frutos secos", m:6, s:["ricota:1.5",FRUTA,NUEZ],
  t:["Preparar la ricota|Poné la ricota en un plato hondo y pisala con un tenedor hasta que quede cremosa. Agregá canela o vainilla.",
     "Cortar la fruta|Cortala en cubos o rodajas y ponela al costado o encima.",
     "Terminar|Picá los frutos secos y espolvoreá por arriba justo antes de comer."]},
 {p:"merienda", n:"Wrap de pavita y queso", m:8, s:["wrap:1","pavita:1.5",QSO(1),ENS(1)],
  t:["Calentar|Calentá el wrap en una sartén seca 20 segundos de cada lado, hasta que se ponga flexible.",
     "Armar el relleno|Poné la pavita y el queso en el centro y la verdura cortada fina arriba, con sal y pimienta.",
     "Enrollar|Doblá primero los extremos hacia adentro y enrollá apretado.",
     "Servir|Cortalo al medio en diagonal. Si querés, sellalo 1 minuto en la sartén para que quede crocante."]},
 {p:"merienda", n:"Galletas de arroz con queso untable, tomate y yogur", m:8, s:["galletas:1","untable:2","tomate:1",YOG],
  t:["Untar|Untá cada galleta de arroz con el queso hasta los bordes.",
     "Tomate|Cortá el tomate en rodajas finas y poné una sobre cada galleta, con sal, orégano y pimienta.",
     "Yogur|Serví el yogur en un vaso o bowl chico.",
     "Comer|Comé las galletas apenas las armás, antes de que el tomate las ablande."]},
 {p:"merienda", n:"Medialuna de jamón y queso con café con leche", m:8, s:["medialuna:1","Fiambre=jamon:1|paleta:1|crudo:1|pavita:1.5|lomito:1.5",QSO(1),LECHE], g:1,
  t:["Abrir y rellenar|Abrí la medialuna al medio y rellenala con el jamón y el queso.",
     "Calentar|Llevala 3 a 4 minutos a horno moderado, o a una sartén tapada a fuego bajo, hasta que el queso se derrita.",
     "Café con leche|Calentá la leche sin que hierva y mezclala con el café.",
     "Disfrutarla|Es un gusto: una sola medialuna. Comela sentado y sin apuro."]},
 {p:"merienda", n:"Tostadas con manteca y dulce de leche, café con leche", m:8, s:[PAN(1),"manteca:1",DULCE,LECHE], g:1,
  t:["Tostar|Tostá el pan hasta que esté bien dorado.",
     "Untar|Con la tostada caliente, extendé la manteca en capa finita y después el dulce de leche, una sola cucharada.",
     "Café con leche|Calentá la leche y mezclala con el café.",
     "Disfrutarla|Es un gusto, así que es esto y nada más: comelo despacio."]},
 {p:"merienda", n:"Tortitas de avena y banana con yogur", m:15, s:["avena:1","banana:1","huevo:1",YOG],
  t:["Hacer la masa|Pisá la banana con un tenedor hasta que quede puré, mezclala con la avena y el huevo.",
     "Calentar la sartén|Poné una sartén antiadherente a fuego medio-bajo y pasale un papel con apenas aceite.",
     "Cocinar|Volcá cucharadas de masa. Cuando aparezcan burbujas (2 a 3 minutos), dalas vuelta y cociná 1 a 2 minutos más.",
     "Servir|Pila de tortitas con el yogur arriba y canela."]},
 {p:"merienda", n:"Panqueques con dulce de leche", m:25, s:["harina:1","huevo:1",LECHE,DULCE], g:1,
  t:["Hacer la masa|Batí el huevo con la leche, agregá la harina de a poco y mezclá hasta que no queden grumos. Dejala descansar 10 minutos.",
     "Calentar la sartén|Usá una sartén antiadherente a fuego medio, apenas aceitada con un papel.",
     "Cocinar|Volcá un cucharón de masa y girá la sartén para que se estire fina. Cociná 1 minuto, dalo vuelta y cociná 30 segundos más.",
     "Rellenar|Untá cada panqueque con dulce de leche en capa finita y enrollalos.",
     "Servir|Son un gusto: con eso es suficiente, comelos con calma."]},
 {p:"merienda", n:"Alfajor con café con leche y fruta", m:5, s:["alfajor:1",LECHE,FRUTA], g:1,
  t:["Servir|Un alfajor, no la caja. Ponelo en un plato, sentate y comelo con calma.",
     "Café con leche|Calentá la leche sin que hierva y mezclala con el café.",
     "Fruta|Cortá la fruta y comela primero o al final: ayuda a que el alfajor no sea lo único."]},
 {p:"merienda", n:"Tostadas con queso y tomate, café con leche", m:8, s:[PAN(1),QSO(1),"tomate:1",LECHE],
  t:["Tostar|Tostá el pan hasta que esté firme.",
     "Armar|Cortá el queso en fetas o aplastalo con un tenedor, poné encima rodajas finas de tomate, sal, orégano y unas gotas de limón.",
     "Gratinar (opcional)|Llevalas 2 minutos al horno fuerte o a una sartén tapada, para que el queso se ablande.",
     "Café con leche|Calentá la leche, mezclala con el café y servilo."]},

 /* ---------- CENA ---------- */
 {p:"cena", n:"Revuelto de zapallitos con huevo y jamón", m:20, s:["huevo:3","zapallito:2","Fiambre=jamon:1|paleta:1|crudo:1|pavita:1.5|lomito:1.5",QSO(1)],
  t:["Cortar|Lavá los zapallitos y cortalos en cubos de 1 cm. Cortá el jamón en tiritas.",
     "Saltear|En una sartén antiadherente con unas gotas de aceite, a fuego medio, salteá los zapallitos 5 minutos con sal y pimienta, hasta que estén tiernos y apenas dorados.",
     "Agregar el jamón|Sumá el jamón y salteá 1 minuto más.",
     "Cuajar los huevos|Batí los huevos, volcalos y revolvé a fuego bajo 2 a 3 minutos, hasta que cuajen pero sigan húmedos.",
     "Terminar|Apagá el fuego, agregá el queso en cubos y tapá 1 minuto: se derrite con el calor."]},
 {p:"cena", n:"Pollo a la plancha con batata y ensalada", m:35, s:[POLLO(1),"batata:1",ENS(1),ACE],
  t:["Hornear la batata|Cortala en gajos con cáscara, mezclala con unas gotas de aceite y sal y horneá a 200 °C 25 minutos, dándola vuelta a la mitad.",
     "Preparar el pollo|Abrí la pechuga al medio en dos filetes finos. Condimentá con sal, pimienta, ajo y orégano.",
     "Cocinar|En plancha o sartén bien caliente, con unas gotas de aceite, cociná 5 a 6 minutos de cada lado, hasta que no quede rosado por dentro.",
     "Ensalada|Lavá y cortá las verduras y aliñalas con el aceite, limón y sal.",
     "Servir|Dejá reposar el pollo 2 minutos antes de cortarlo y armá el plato."]},
 {p:"cena", n:"Tortilla de papa y cebolla con ensalada", m:30, s:["huevo:3","papa:1","cebolla:1",ENS(1),ACE],
  t:["Cocinar la papa|Pelala y cortala en rodajas finas. Hervila 8 minutos, hasta que esté tierna pero entera, y escurrila.",
     "Rehogar la cebolla|En una sartén antiadherente con el aceite, cociná la cebolla en juliana a fuego bajo 8 minutos, hasta que esté transparente y dulce.",
     "Mezclar|Batí los huevos con sal y pimienta y mezclalos con la papa y la cebolla.",
     "Cuajar|Volcá todo en la sartén a fuego bajo, tapá y cociná 6 a 7 minutos, hasta que los bordes se despeguen.",
     "Dar vuelta|Ayudate con un plato grande, dala vuelta y cociná 4 minutos del otro lado. Servila con la ensalada."]},
 {p:"cena", n:"Humita en olla con pollo desmenuzado", m:35, s:["choclo:2",POLLO(1),"cebolla:1",QSO(1)],
  t:["Cocinar el pollo|Hervi la pechuga 15 minutos en agua con sal y desmenuzala con dos tenedores.",
     "Desgranar|Cortá los granos del choclo con un cuchillo, apoyando la mazorca parada.",
     "Rehogar|En una olla, con unas gotas de aceite, rehogá la cebolla picada 5 minutos con pimentón y una pizca de azúcar si querés.",
     "Cocinar la humita|Agregá el choclo y un chorrito de agua y cociná 10 a 15 minutos a fuego bajo, revolviendo.",
     "Terminar|Sumá el pollo y el queso en cubos, mezclá y servila caliente con pimienta."]},
 {p:"cena", n:"Omelette de verduras y queso con ensalada", m:15, s:["huevo:3",QSO(1),COC(1),ENS(1),ACE],
  t:["Saltear la verdura|Cortala en cubos chicos y salteala 3 a 4 minutos con la mitad del aceite, hasta que esté tierna.",
     "Batir los huevos|Batilos con sal y pimienta.",
     "Cuajar|En la sartén con el resto del aceite a fuego medio-bajo, volcá los huevos y esperá 1 a 2 minutos hasta que los bordes se despeguen.",
     "Rellenar|Poné la verdura y el queso en una mitad y doblá. Dejala 1 minuto más.",
     "Servir|Con la ensalada aliñada con limón."]},
 {p:"cena", n:"Merluza al horno con papa y verduras", m:40, s:["merluza:1","papa:1.5",COC(1),ACE],
  t:["Hornear la papa|Cortala en rodajas de 1 cm, condimentala con sal y la mitad del aceite y horneala a 200 °C 20 minutos.",
     "Preparar la merluza|Secala bien con papel de cocina, salpimentala y rociala con limón y el resto del aceite.",
     "Hornear el pescado|Sumala sobre las papas y cociná 12 a 15 minutos, hasta que se desarme fácil con el tenedor.",
     "Verdura|Salteá o hervila la verdura 5 minutos y servila con todo."]},
 {p:"cena", n:"Carne magra con arroz y ensalada", m:30, s:[CARNE(1),"arroz:1",ENS(1),ACE],
  t:["Cocinar el arroz|Hervilo en agua con sal el tiempo del paquete y escurrilo.",
     "Preparar la carne|Sacala de la heladera 15 minutos antes y secala. Salpimentá.",
     "Cocinar|En plancha o sartén muy caliente, 3 a 4 minutos de cada lado para punto medio. Dejala reposar 3 minutos.",
     "Ensalada|Aliñala con el aceite, limón y sal.",
     "Servir|Cortá la carne en fetas y servila con el arroz y la ensalada."]},
 {p:"cena", n:"Lentejas con verduras y huevo", m:25, s:["lentejas:1.5",COC(1),"huevo:2",ACE],
  t:["Calentar las lentejas|Si son de lata, enjuagalas. Calentalas 10 minutos con la verdura picada, cebolla, pimentón, comino y un poco de agua o caldo.",
     "Hacer los huevos|Hervilos 9 minutos, o hacelos a la plancha con unas gotas de aceite, con la yema blanda.",
     "Servir|Poné las lentejas en un plato hondo, el huevo arriba y el chorrito de aceite crudo."]},
 {p:"cena", n:"Ensalada de atún con huevo y palta", m:15, s:["atun:1","huevo:2",ENS(1.5),"palta:1"],
  t:["Hervir los huevos|9 minutos desde que rompe el hervor, agua fría después.",
     "Armar la base|Lavá y cortá la verdura en un bowl grande.",
     "Sumar|Escurrí el atún, desmenuzalo y ponelo arriba. Cortá la palta en cubos.",
     "Terminar|Agregá los huevos en cuartos, sal, limón y pimienta."]},
 {p:"cena", n:"Lomo de cerdo con papa y verduras", m:40, s:["cerdo:1","papa:1",COC(1),ENS(1),ACE],
  t:["Hacer la papa|Cortala en gajos con cáscara, condimentala y horneala 25 minutos a 200 °C.",
     "Cocinar el cerdo|Cortá el lomo en fetas de 2 cm, salpimentá y cocinalo en plancha caliente 4 a 5 minutos por lado, hasta que no quede rosado.",
     "Verdura|Hervila 5 minutos o salteala con el aceite.",
     "Servir|Con la ensalada aliñada."]},
 {p:"cena", n:"Caballa con choclo y ensalada", m:20, s:["caballa:1","choclo:1",ENS(1.5),"huevo:1",ACE],
  t:["Hervir|Hervi el choclo 15 minutos y el huevo 9 minutos.",
     "Armar la ensalada|Lavá y cortá la verdura en un bowl.",
     "Sumar|Desgrané el choclo, picá el huevo y desmenuzá la caballa escurrida.",
     "Aliñar|Con el aceite, limón, sal y pimienta."]},
 {p:"cena", n:"Pollo con quinoa y ensalada", m:30, s:[POLLO(1),"quinoa:1",ENS(1),ACE],
  t:["Cocinar la quinoa|Enjuagala bien y hervila 12 a 15 minutos hasta que se abra el anillito. Escurrila.",
     "Pollo|Cortá la pechuga en tiras, salpimentá y cocinala en plancha 5 minutos.",
     "Ensalada|Aliñala con el aceite y limón.",
     "Servir|Mezclá la quinoa con el pollo y acompañá con la ensalada."]},
 {p:"cena", n:"Sopa de verduras con huevo poché y tostadas", m:35, s:["zapallo:1",COC(1),"zanahoria:1","huevo:2",PAN(1),"rallado:1"],
  t:["Cortar|Pelá y cortá el zapallo, la zanahoria y la verdura en cubos chicos.",
     "Hacer la sopa|Hervilas en agua con sal 20 minutos, hasta que estén tiernas. Probá y ajustá la sal.",
     "Pochar los huevos|Bajá el fuego a mínimo, rompé los huevos de a uno y dejá que se cocinen en la sopa 3 minutos, hasta que la clara cuaje.",
     "Tostadas|Tostá el pan mientras tanto.",
     "Servir|Sopa en plato hondo con el huevo arriba, queso rallado y las tostadas al costado."]},
 {p:"cena", n:"Milanesa de pollo al horno con ensalada", m:35, s:[POLLO(1),"huevo:1","panrallado:1",ENS(1.5),ROC,"rallado:1"],
  t:["Preparar el pollo|Cortá la pechuga en dos filetes finos y golpealos para emparejar el espesor.",
     "Rebozar|Batí el huevo con sal, ajo y perejil. Pasá los filetes por el huevo y después por el pan rallado mezclado con el queso rallado.",
     "Hornear|Ponelas en una placa aceitada con el rocío. Horno fuerte (220 °C), 12 minutos de cada lado.",
     "Servir|Con la ensalada aliñada con limón."]},
 {p:"cena", n:"Salmón a la plancha con papa y ensalada", m:30, s:["salmon:1","papa:1",ENS(1)],
  t:["Hervir la papa|Cortala en cubos y hervila 12 minutos, hasta que esté tierna.",
     "Cocinar el salmón|Secalo, salpimentalo y cocinalo en plancha caliente 4 minutos del lado de la piel y 3 del otro, con limón.",
     "Ensalada|Lavá y cortá las verduras.",
     "Servir|Armá el plato: salmón, papa y la ensalada con limón y sal."]},
 {p:"cena", n:"Langostinos al ajillo con arroz y ensalada", m:25, s:["langostinos:1","arroz:1",ENS(1),ACE],
  t:["Cocinar el arroz|Hervilo y escurrilo.",
     "Preparar los langostinos|Pelalos, secalos y condimentalos con sal, pimienta y pimentón.",
     "Saltear|En sartén caliente con el aceite y 2 dientes de ajo picados, cocinalos 2 minutos de cada lado, hasta que estén rosados.",
     "Servir|Sobre el arroz, con perejil y la ensalada."]},
 {p:"cena", n:"Asado con ensalada", m:60, s:["Corte=asado:1|vacio:0.75|entrana:0.75|matambre:0.75|ojo:0.75",ENS(1.5),ACE], g:1,
  t:["Parrilla|Prendé las brasas 40 minutos antes: tienen que estar cubiertas de ceniza gris.",
     "Preparar|Sacá la grasa visible de los cortes y salalos justo antes.",
     "Cocinar|25 a 30 minutos a fuego medio, dándolos vuelta una sola vez.",
     "Ensalada|Grande, con el aceite y limón, para llenarte con verdura."]},
 {p:"cena", n:"Bife de chorizo con papas al horno y ensalada", m:45, s:["Corte=bife:1|ojo:1",ENS(1.5),"papa:1.5"], g:1,
  t:["Papas|Cortalas en gajos y horneá a 200 °C 25 minutos con sal y orégano.",
     "Bife|Sacalo de la heladera 15 minutos antes y salalo recién al ponerlo en la plancha caliente, 3 a 4 minutos por lado.",
     "Reposar|Dejalo 3 minutos antes de cortar para que no suelte los jugos.",
     "Servir|Con ensalada grande."]},
 {p:"cena", n:"Choripán con ensalada", m:30, s:["chorizo:1","frances:1",ENS(1.5)], g:1,
  t:["Cocinar el chorizo|Pinchalo y cocinalo a la parrilla o en sartén 15 a 20 minutos a fuego medio, dándolo vuelta.",
     "Armar|Abrí el pan, tostalo y poné el chorizo adentro.",
     "Chimichurri|Perejil, ajo, orégano, ají molido, vinagre y unas gotas de aceite.",
     "Servir|Con una ensalada grande para sumar volumen."]},
 {p:"cena", n:"Empanadas de carne al horno con ensalada", m:25, s:["empanada:2",ENS(1)], g:1,
  t:["Recalentar|Horno fuerte 15 a 20 minutos sobre una placa, para que la masa se ponga crocante.",
     "Ensalada|Lavá y cortá las verduras y aliñalas con limón.",
     "Servir|Una o dos empanadas con la ensalada primero."]},
 {p:"cena", n:"Pizza de muzzarella con ensalada", m:15, s:["pizza:2",ENS(1.5)], g:1,
  t:["Recalentar|Horno fuerte 8 a 10 minutos hasta que el borde esté crocante.",
     "Ensalada|Grande, aliñada con limón.",
     "Servir|Comé primero la ensalada y después las porciones, despacio."]},
 {p:"cena", n:"Tarta de verduras con ensalada", m:20, s:["tarta:1.5",ENS(1.5)], g:1,
  t:["Recalentar|Horno moderado 10 minutos para que la masa quede crocante.",
     "Ensalada|Lavá y cortá las verduras.",
     "Servir|Porción de tarta con la ensalada grande."]},
 /* ---------- NUEVAS: cortes, fiambres, dulces ---------- */
 {p:"desayuno", n:"Yogur con granola, fruta y frutos secos", m:6, s:[YOG,"granola:1",FRUTA,NUEZ],
  t:["Preparar la fruta|Lavá la fruta y cortala en cubos o rodajas finas.",
     "Armar la base|Poné el yogur en un bowl o vaso ancho.",
     "Sumar la granola|Agregala recién antes de comer, para que no se ablande y se mantenga crocante.",
     "Terminar|Poné la fruta encima y los frutos secos picados grueso. Si querés más dulzor, una cucharadita de miel."]},
 {p:"merienda", n:"Vigilante con café con leche", m:5, s:[QSO(2),"Dulce=membrillo:1|dulcebat:1",LECHE],
  t:["Cortar|Cortá el queso en una feta de 1 cm de espesor y el dulce en una feta de grosor parecido.",
     "Armar|Poné el dulce arriba del queso, o servilos al lado en el mismo plato. Es el clásico postre argentino.",
     "Café con leche|Calentá la leche sin que hierva y mezclala con el café.",
     "Comer|Probá un trocito de queso con un trocito de dulce en cada bocado: con poca cantidad se siente completo."]},
 {p:"almuerzo", n:"Vitel toné liviano con papas", m:70, s:["peceto:1","atun:0.5",YOG,ENS(1),"papa:1.5"],
  t:["Cocinar el peceto|Poné el peceto atado en una olla con agua, sal, laurel, zanahoria y cebolla. Cociná tapado a fuego bajo 50 a 60 minutos, hasta que al pincharlo salga jugo claro.",
     "Dejarlo enfriar|Sacalo del caldo y dejalo enfriar completamente, mejor 1 hora en la heladera: así se corta en fetas finas sin deshacerse.",
     "Hacer la salsa|Procesá el atún bien escurrido con el yogur, unas gotas de limón, sal, pimienta y una cucharadita de alcaparras si tenés, hasta que quede una crema lisa.",
     "Hervir las papas|Hervilas 15 a 18 minutos con cáscara y cortalas en rodajas.",
     "Armar|Cortá el peceto en fetas finas, napalo con la salsa y servilo con las papas y la ensalada."]},
 {p:"almuerzo", n:"Osobuco braseado con puré de zapallo", m:90, s:["osobuco:1","zapallo:2","papa:1","cebolla:1","salsa:1",ACE],
  t:["Sellar|Salpimentá el osobuco y doralo en una olla con el aceite, a fuego fuerte, 3 a 4 minutos de cada lado. Retiralo.",
     "Hacer el fondo|En la misma olla rehogá la cebolla picada 5 minutos con ajo, pimentón y laurel. Sumá la salsa de tomate.",
     "Brasear|Devolvé el osobuco, agregá una taza de agua o caldo, tapá y cociná a fuego muy bajo 60 a 70 minutos, hasta que la carne se despegue del hueso.",
     "Puré|Hervi el zapallo y la papa 20 minutos hasta que estén bien tiernos y pisalos con un poco de agua de cocción, sal y nuez moscada.",
     "Servir|Poné el osobuco sobre el puré y cubrilo con la salsa de la olla."]},
 {p:"almuerzo", n:"Hígado encebollado con puré de papa", m:35, s:["higado:1","cebolla:1.5","papa:2",ENS(1),ACE],
  t:["Hacer el puré|Hervi las papas peladas 20 minutos y pisalas con un poco de agua de cocción, sal y nuez moscada, sin manteca.",
     "Rehogar la cebolla|En una sartén con la mitad del aceite, cociná la cebolla en juliana a fuego bajo 10 minutos, hasta que esté dorada y dulce.",
     "Cocinar el hígado|Cortalo en fetas finas, secalo bien y cocinalo en otra sartén bien caliente con el resto del aceite, 1 a 2 minutos de cada lado. No lo pases: se endurece.",
     "Juntar|Sumá el hígado a la cebolla, salpimentá y mezclá 1 minuto.",
     "Servir|Con el puré y la ensalada con limón."]},
 {p:"almuerzo", n:"Carne al horno con papas, cebolla y morrón", m:75, s:[CARNE(1),"papa:2","cebolla:1","morron:1",ACE],
  t:["Precalentar|Horno fuerte (200 °C) 10 minutos antes.",
     "Condimentar la carne|Salpimentala y frotala con ajo, orégano y pimentón. Doralá 2 minutos de cada lado en una sartén caliente para sellarla.",
     "Armar la fuente|Cortá las papas en rodajas gruesas, la cebolla y el morrón en tiras. Mezclalos con el aceite y sal en una fuente y poné la carne en el centro.",
     "Hornear|Cociná 45 a 50 minutos, dando vuelta las papas a la mitad. Si se seca, agregá un chorrito de agua.",
     "Reposar|Dejá reposar la carne 5 minutos antes de cortarla en fetas finas."]},
 {p:"almuerzo", n:"Cerdo con manzana y batata", m:40, s:["solomillo:1.25","manzana:1","batata:1.5",COC(1),ACE],
  t:["Hornear la batata|Cortala en gajos con cáscara, condimentala con sal y unas gotas de aceite y horneala 25 a 30 minutos a 200 °C.",
     "Cortar|Cortá el solomillo en medallones de 2 cm y la manzana en gajos, con cáscara.",
     "Sellar el cerdo|En sartén caliente con el aceite, cociná los medallones 3 a 4 minutos de cada lado con sal, pimienta y romero o tomillo.",
     "Sumar la manzana|Agregá la manzana a la misma sartén los últimos 3 minutos para que se dore y se ablande apenas.",
     "Servir|Con la batata y la verdura cocida."]},
 {p:"almuerzo", n:"Peceto a la plancha con puré rústico y ensalada", m:40, s:["peceto:1","papa:1.5",ENS(1),ACE],
  t:["Hacer el puré|Hervi las papas con cáscara 20 minutos, pelalas y pisalas toscamente con sal, pimienta y un chorrito de aceite.",
     "Preparar el peceto|Cortalo en bifes de 2 cm, salpimentalos y dejalos 10 minutos a temperatura ambiente.",
     "Cocinar|En plancha o sartén bien caliente, 3 minutos de cada lado para punto medio. Dejalos reposar 2 minutos.",
     "Servir|Con el puré y la ensalada aliñada con limón."]},
 {p:"almuerzo", n:"Bondiola al horno con batata y ensalada", m:150, s:["bondiola:1","batata:1.5",ENS(1)], g:1,
  t:["Condimentar|Salpimentá la bondiola y frotala con ajo, mostaza, orégano y pimentón. Si podés, dejala en la heladera 1 hora.",
     "Hornear|Horno moderado (170 °C), tapada con papel de aluminio, 1 hora y media a 2 horas, hasta que esté bien tierna.",
     "Batata|Sumá la batata en gajos los últimos 40 minutos.",
     "Dorar|Destapá los últimos 10 minutos para que dore. Dejala reposar 10 minutos y cortala en fetas finas.",
     "Servir|Con la ensalada. Es un gusto, así que una porción medida."]},
 {p:"almuerzo", n:"Matambre a la pizza con ensalada", m:70, s:["matambre:1","muzza:1.5","salsa:1",ENS(1.5)], g:1,
  t:["Cocinar el matambre|Hervilo o hornealo tapado hasta que esté tierno (1 hora, aproximadamente) y secalo.",
     "Armar|Ponelo en una placa con la salsa de tomate por arriba y orégano.",
     "Gratinar|Cubrí con la muzzarella y gratiná 10 a 12 minutos en horno fuerte, hasta que burbujee y dore.",
     "Servir|Con una ensalada grande."]},
 {p:"almuerzo", n:"Entraña con ensalada y papas rústicas", m:50, s:["entrana:1",ENS(1.5),"papa:1.5"], g:1,
  t:["Papas|Cortalas en gajos con cáscara, condimentalas y horneá 30 minutos a 200 °C.",
     "Preparar la entraña|Sacala de la heladera 20 minutos antes y salala justo antes de cocinar.",
     "Parrilla|Cociná en parrilla o plancha muy caliente 3 a 4 minutos de cada lado: es un corte fino, no la pases.",
     "Servir|Cortala en tiras contra la fibra y servila con la ensalada y las papas."]},
 {p:"almuerzo", n:"Vacío con batata y ensalada", m:90, s:["vacio:1","batata:1",ENS(1.5)], g:1,
  t:["Preparar|Sacá la grasa más gruesa y salalo justo antes de cocinarlo.",
     "Parrilla|Cociná a fuego medio-bajo, 40 a 50 minutos con la parte de la grasa hacia abajo primero, dándolo vuelta una sola vez.",
     "Batata|Envolvela en aluminio y cocinala en las brasas 40 minutos, o al horno.",
     "Reposar|Dejá reposar el vacío 5 minutos y cortalo en fetas finas.",
     "Servir|Con la ensalada grande."]},
 {p:"cena", n:"Peceto a la plancha con puré rústico y ensalada", m:40, s:["peceto:1","papa:1.5",ENS(1),ACE],
  t:["Hacer el puré|Hervi las papas con cáscara 20 minutos, pelalas y pisalas toscamente con sal, pimienta y un chorrito de aceite.",
     "Preparar el peceto|Cortalo en bifes de 2 cm y salpimentalos.",
     "Cocinar|Plancha bien caliente, 3 minutos de cada lado. Reposá 2 minutos.",
     "Servir|Con el puré y la ensalada con limón."]},
 {p:"cena", n:"Hígado a la plancha con cebolla y ensalada", m:25, s:["higado:1","cebolla:1",ENS(1.5),"papa:1"],
  t:["Cocinar la papa|Hervila con cáscara 15 minutos y cortala en rodajas.",
     "Rehogar la cebolla|Cebolla en juliana con unas gotas de aceite, fuego bajo, 8 a 10 minutos.",
     "Cocinar el hígado|Fetas finas, plancha caliente, 1 a 2 minutos de cada lado, salpimentado.",
     "Servir|Con la cebolla arriba, la papa y la ensalada."]},
 {p:"cena", n:"Trucha a la plancha con arroz y verduras", m:30, s:["trucha:1","arroz:1",COC(1),ACE],
  t:["Arroz|Hervilo en agua con sal el tiempo del paquete.",
     "Preparar la trucha|Secala, salpimentala y rociala con limón.",
     "Cocinar|Plancha o sartén con el aceite, 4 minutos del lado de la piel y 2 del otro.",
     "Verdura|Salteala o hervila 5 minutos.",
     "Servir|Todo junto con más limón."]},
 {p:"cena", n:"Calamares a la plancha con arroz integral y ensalada", m:35, s:["calamares:1","integral:1.5",ENS(1),ACE],
  t:["Arroz integral|Hervilo 30 a 35 minutos hasta que esté tierno y escurrilo.",
     "Limpiar los calamares|Cortalos en anillos y secalos muy bien con papel para que no larguen agua.",
     "Cocinar|En sartén muy caliente con el aceite, 2 minutos en total, sin moverlos demasiado. Sumá ajo, perejil, sal y limón.",
     "Servir|Sobre el arroz, con la ensalada."]},
 {p:"cena", n:"Mejillones al limón con papa y ensalada", m:30, s:["mejillones:1","papa:1.5",ENS(1),ACE],
  t:["Papa|Hervila con cáscara 15 minutos y cortala en rodajas.",
     "Calentar los mejillones|Si son cocidos, salteálos 2 minutos con el aceite, ajo y perejil. Si son crudos, cocinalos tapados hasta que se abran.",
     "Aliñar|Rociá con limón y pimienta.",
     "Servir|Con la papa y la ensalada."]},
 {p:"cena", n:"Tortilla de claras y espinaca con tostada", m:20, s:["claras:2","huevo:1",COC(2),QSO(1),PAN(1)],
  t:["Cocinar la verdura|Picá la verdura y salteala 3 a 4 minutos con unas gotas de aceite.",
     "Batir|Batí las claras y el huevo entero con sal, pimienta y nuez moscada.",
     "Cuajar|Volcá los huevos en la sartén a fuego medio-bajo, sumá la verdura y el queso en cubos y tapá 4 a 5 minutos.",
     "Dar vuelta|Dale vuelta con un plato y cociná 1 minuto más.",
     "Servir|Con la tostada."]},
 {p:"cena", n:"Provoleta a la parrilla con jamón crudo y ensalada", m:15, s:["provoleta:1","crudo:2","tomate:1",ENS(1)], g:1,
  t:["Preparar la provoleta|Ponela en una sartén o chapa que aguante el calor, con orégano, ají molido y una gota de aceite.",
     "Cocinar|A fuego medio, 3 a 4 minutos por lado, hasta que se derrita por dentro y se dore por fuera.",
     "Ensalada|Cortá el tomate y la verdura y condimentá con limón.",
     "Servir|Provoleta recién hecha, con el jamón crudo y la ensalada: es un gusto, una sola porción."]},
 {p:"cena", n:"Costillitas de cerdo con ensalada y papa", m:60, s:["costillitas:1",ENS(1.5),"papa:1"], g:1,
  t:["Condimentar|Salpimentá y marinalas 30 minutos con ajo, mostaza, miel y orégano.",
     "Cocinar|En horno moderado 50 a 60 minutos, o a la parrilla a fuego bajo, dándolas vuelta.",
     "Papa|Hervila o hornéala con cáscara.",
     "Servir|Con una ensalada grande."]},
 /* ---------- NUEVAS 2: lácteos, verduras, pescados, cortes y gustos ---------- */
 {p:"desayuno", n:"Chocolatada con tostadas, queso y fruta", m:6, s:["chocolatada:1",PAN(1),QSO(1),FRUTA],
  t:["Calentar la chocolatada|Servila en una taza y calentala 1 minuto en el microondas, o en una ollita a fuego bajo hasta que largue vapor, sin hervir.",
     "Tostar el pan|Tostalo 2 a 3 minutos hasta que tome color dorado parejo.",
     "Armar las tostadas|Poné el queso en fetas o untado sobre el pan todavía tibio, para que se ablande.",
     "Sumar la fruta|Lavala y comela entera o en cubos, al costado."]},
 {p:"desayuno", n:"Yogur proteico con avena, banana y frutos secos", m:5, s:["yprot:1","avena:1","banana:1",NUEZ],
  t:["Ablandar la avena|Mezclá la avena con 2 cucharadas de agua o del propio yogur y dejala 3 minutos, así queda cremosa y no seca.",
     "Cortar la banana|Pelala y cortala en rodajas finas.",
     "Armar el bowl|En un bowl poné el yogur, la avena y la banana por encima.",
     "Terminar|Picá los frutos secos grueso y repartilos arriba. Si querés un toque dulce, canela o una gota de miel."]},
 {p:"desayuno", n:"Huevos revueltos con verduras y tostadas", m:12, s:["huevo:2",COC(1),PAN(1),LECHE],
  t:["Saltear la verdura|Cortá la verdura en trozos chicos y salteala en una sartén antihaderente con un rocío de aceite, a fuego medio, 4 a 5 minutos, hasta que esté tierna.",
     "Batir los huevos|Batilos en un bowl con sal y pimienta, con un tenedor, hasta que no queden partes sueltas.",
     "Revolver|Volcá los huevos sobre la verdura a fuego bajo y movelos con una cuchara de madera 2 a 3 minutos, hasta que estén cremosos pero firmes.",
     "Servir|Con las tostadas y el café con leche. Los huevos siguen cocinándose con el calor de la sartén, así que no los pases."]},
 {p:"desayuno", n:"Tostadas con ricota, miel y frutos secos", m:6, s:[PAN(1),"Ricota=ricota:1|ricotae:1","miel:1",NUEZ,FRUTA],
  t:["Tostar|Tostá el pan 2 a 3 minutos.",
     "Untar|Pasale la ricota por encima, en capa pareja, con una cuchara.",
     "Terminar|Un hilo de miel y los frutos secos picados. Podés espolvorear canela.",
     "Fruta|Acompañá con la fruta entera o en trozos."]},
 {p:"desayuno", n:"Sándwich de queso y tomate con café con leche", m:6, s:["frances:1",QSO(1),"tomate:1",LECHE,FRUTA],
  t:["Abrir el pan|Cortá el miñón al medio y tostalo apenas 1 a 2 minutos.",
     "Armar|Poné el queso en fetas y el tomate en rodajas finas con sal, pimienta y orégano.",
     "Calentar|Si querés, llevalo 1 minuto al horno o a la sartén tapada, hasta que el queso se ablande.",
     "Bebida y fruta|Servilo con el café con leche y la fruta."]},
 {p:"desayuno", n:"Kefir con granola, fruta y frutos secos", m:5, s:["kefir:1","granola:1",FRUTA,NUEZ],
  t:["Cortar la fruta|Lavala y cortala en cubos.",
     "Armar|Servi el kefir en un bowl o vaso ancho.",
     "Sumar|Agregá la fruta, y la granola recién al final para que quede crocante.",
     "Terminar|Los frutos secos picados por encima."]},
 {p:"intervalo", n:"Queso cottage con tomate cherry y grisines", m:3, s:["cottage:1","tcherry:1","grisines:1"],
  t:["Cortar|Lavá los tomates cherry y cortalos al medio.",
     "Servir|Poné el cottage en un bowl y los tomates por encima con sal, pimienta y orégano.",
     "Acompañar|Comelo con los grisines."]},
 {p:"intervalo", n:"Postre light con fruta", m:3, s:["Postre=postrel:1|flanl:1",FRUTA],
  t:["Fruta|Cortá la fruta en cubos y repartila arriba del postre.",
     "Servir|Sacalo de la heladera un par de minutos antes para que no esté tan frío."]},
 {p:"intervalo", n:"Hummus con bastones de zanahoria y apio", m:8, s:["hummus:1","zanahoria:1","apio:1"],
  t:["Preparar los bastones|Pelá la zanahoria y cortala en bastones de unos 8 cm. Cortá el apio igual, sin las hojas.",
     "Servir el hummus|Poné el hummus en un bowl chico, con un chorrito de limón y pimentón.",
     "Mojar|Mojá los bastones directo en el hummus."]},
 {p:"intervalo", n:"Yogur proteico con frutos rojos y chía", m:3, s:["yprot:1","frutosrojos:1","chia:1"],
  t:["Armar|Poné el yogur en un vaso y los frutos rojos arriba, lavados.",
     "Chía|Espolvoreá la chía y mezclá apenas. Si la dejás 5 minutos, se hidrata y queda cremoso."]},
 {p:"intervalo", n:"Kefir con banana", m:3, s:["kefir:1","banana:1"],
  t:["Cortar|Pelá la banana y cortala en rodajas.",
     "Servir|Poné el kefir en un vaso ancho con la banana arriba, o licuá todo 30 segundos."]},
 {p:"intervalo", n:"Barra de cereal con fruta", m:2, s:["barra:1",FRUTA],
  t:["Elegir|Una barra de cereal con poco azúcar, y la fruta entera.",
     "Comer|Primero la fruta, así te llena más y la barra rinde."]},
 {p:"almuerzo", n:"Hamburguesas con papas al horno y ensalada", m:40, s:["hamburguesa:2","hamb:1",PAPA(1),ENS(1),"ketchup:1"],
  t:["Precalentar|Prendé el horno a 220 °C.",
     "Papas|Cortá la papa en bastones gruesos con cáscara, mezclalas con un rocío de aceite, sal y pimentón, y ponelas en una placa sin amontonar. Horno 30 a 35 minutos, dándolas vuelta a la mitad.",
     "Hamburguesas|En una sartén antihaderente caliente, cociná las hamburguesas 4 a 5 minutos de cada lado, hasta que no queden rosadas por dentro.",
     "Armar|Abrí el pan, tostalo en la sartén 1 minuto y armá con la hamburguesa, tomate y lechuga si tenés, y el ketchup. La ensalada va al costado."]},
 {p:"almuerzo", n:"Milanesa de pollo a la napolitana con ensalada", m:30, s:["supremac:2","salsa:1","muzza:1",ENS(1),PAPA(0.5)],
  t:["Precalentar|Horno a 200 °C. Poné las milanesas en una placa con papel manteca.",
     "Primera cocción|Horno 15 minutos, dándolas vuelta a mitad de tiempo, hasta que estén doradas.",
     "Napolitana|Cubrí cada milanesa con 2 cucharadas de salsa de tomate y una feta de muzzarella. Volvé al horno 5 a 7 minutos hasta que el queso se derrita.",
     "Acompañar|Con la papa hervida o al horno, y la ensalada condimentada con sal, limón y unas gotas de aceite."]},
 {p:"almuerzo", n:"Wok de pollo y verduras con arroz", m:25, s:["pollo:1.5","arroz:1",COC(1.5),"soja_s:1","aceite:1"],
  t:["Preparar|Cortá el pollo en tiritas finas y la verdura en trozos chicos y parejos, así se cocinan a la vez.",
     "Sellar el pollo|En una sartén grande o wok bien caliente con el aceite, salteá el pollo 5 a 6 minutos hasta que dore. Sacalo a un plato.",
     "Saltear la verdura|En la misma sartén, la verdura 4 a 5 minutos a fuego fuerte, moviendo seguido, hasta que esté tierna pero firme.",
     "Juntar|Volvé el pollo, sumá la salsa de soja y el arroz ya cocido, y revolvé 2 minutos para calentar todo."]},
 {p:"almuerzo", n:"Ravioles con salsa y pollo desmenuzado", m:30, s:["ravioles:1","pollo:1","salsa:1","rallado:1",ENS(1)],
  t:["Cocinar el pollo|Herví la pechuga entera 15 a 18 minutos en agua con sal. Sacala y desmenuzala con dos tenedores.",
     "Ravioles|En otra olla con agua hirviendo y sal, cociná los ravioles según el paquete (suelen ser 4 a 6 minutos), hasta que floten. Colalos con cuidado.",
     "Salsa|Calentá la salsa de tomate con el pollo desmenuzado 3 a 4 minutos.",
     "Servir|Los ravioles con la salsa, el queso rallado y la ensalada al costado."]},
 {p:"almuerzo", n:"Pollo al verdeo con puré", m:40, s:[POLLO(1.25),"verdeo:1","cebolla:1",PAPA(1),"manteca:1",ENS(1),"aceite:1"],
  t:["Sellar el pollo|Cortá el pollo en trozos, salpimentalo y dorálo 4 minutos de cada lado en una sartén con el aceite.",
     "Verdeo y cebolla|Sumá la cebolla picada y el verdeo en rodajas. Tapá y cociná 12 a 15 minutos a fuego bajo, hasta que el pollo esté bien cocido y haya salsa.",
     "Puré|Herví la papa pelada y en trozos 15 a 20 minutos. Escurrila, pisala con la manteca, sal y un chorrito de agua de la cocción.",
     "Servir|Pollo con la salsa de verdeo, el puré y la ensalada."]},
 {p:"almuerzo", n:"Albóndigas con puré y ensalada", m:45, s:["picada:1.5","huevo:1","panrallado:1","salsa:1",PAPA(1),ENS(1)],
  t:["Mezclar|En un bowl mezclá la carne picada con el huevo, el pan rallado, sal, pimienta, ajo y perejil, hasta que quede una masa pareja.",
     "Formar|Con las manos húmedas armá bolitas del tamaño de una nuez. Salen unas 10 a 12.",
     "Cocinar|Calentá la salsa en una sartén ancha, poné las albóndigas adentro, tapá y cocinalas 20 minutos a fuego bajo, dándolas vuelta una vez.",
     "Puré y ensalada|Herví la papa 15 a 20 minutos y pisala con sal y un poco de agua de cocción. Servilo con las albóndigas y la ensalada."]},
 {p:"almuerzo", n:"Estofado de garrón con papas y zanahoria", m:110, s:["garron:1.25","papa:1","zanahoria:1","cebolla:1","salsa:1","aceite:1","fideos:0.5"],
  t:["Sellar|Cortá el garrón en cubos y dorálo en una olla con el aceite, 6 a 8 minutos, hasta que tome color por todos lados.",

  r.steps=r.t.map(function(s){ var k=s.indexOf("|"); return k>-1?{h:s.slice(0,k),d:s.slice(k+1)}:{h:"",d:s}; });
});

function aFr(v){
  var e=Math.floor(v+0.001), r=v-e;
  if(Math.abs(r)<0.01){ return String(e); }
  if(Math.abs(r-0.5)<0.01){ return (e>0?e:"")+"½"; }
  if(Math.abs(r-0.25)<0.01){ return (e>0?e:"")+"¼"; }
  if(Math.abs(r-0.75)<0.01){ return (e>0?e:"")+"¾"; }
  return (Math.round(v*10)/10).toString().replace(".",",");
}
function aCant(f,q){
  var v=f.n*q;
  if(f.u==="g"||f.u==="ml"){ return Math.round(v)+" "+f.u; }
  return aFr(v)+" "+((v<=1)?f.u:f.pl);
}
function aCorto(nom){ return nom.replace(/ \(.*\)$/,""); }
function aNTild(){ return Object.keys(despensa).filter(function(k){return despensa[k];}).length; }

var A_EL={desayuno:"el desayuno",int1:"el intervalo",int2:"el intervalo",almuerzo:"el almuerzo",merienda:"la merienda",cena:"la cena"};

function aRecDe(id){ return A_REC.filter(function(r){return r.id===id;})[0]; }

/* paso de cada "+" / "−": una unidad natural (1 empanada, 40 g de arroz, ½ plato…) */
function aStepQ(f){
  var u;
  if(f.u==="ml"){ u=50; }
  else if(f.u==="g"){ u=Math.max(5,Math.round(f.n/4/5)*5); if(f.n>=180){ u=50; } }
  else if(f.n<1){ u=f.n; }
  else if(f.u==="plato"||f.u==="plato grande"){ u=0.5; }
  else { u=1; }
  return u/f.n;
}

/* ---------- presupuesto del día ----------
   Desayuno, almuerzo, merienda y cena son la base, pero se pueden saltear.
   Los intervalos son opcionales: no se reserva nada para ellos. */
function aReserva(s){ return ({desayuno:250,almuerzo:350,merienda:200,cena:300}[s.id]||200); }
function aEstado(id){ return sel[id] ? (sel[id].skip?"skip":"hecha") : "pend"; }
function aConsumido(excepto){
  var k=0; Object.keys(sel).forEach(function(id){ if(id!==excepto && !sel[id].skip){ k+=sel[id].k; } }); return k;
}
function aPendientes(excepto){ return A_SECC.filter(function(s){ return !s.int && s.id!==excepto && aEstado(s.id)==="pend"; }); }
function aPresupuesto(secId){
  var sec=aSecDe(secId), restante=A_KCAL-aConsumido(secId);
  var pend=aPendientes(secId);
  var reserva=pend.reduce(function(a,s){ return a+aReserva(s); },0);
  var maximo=Math.max(0,restante-reserva);
  var objetivo;
  if(sec.int){ objetivo=Math.min(sec.kcal,maximo); }
  else {
    var suma=pend.reduce(function(a,s){ return a+s.kcal; },sec.kcal);
    objetivo=Math.max(0,Math.round(Math.min(restante*sec.kcal/suma, sec.kcal*1.3)));   /* saltear una comida no te obliga a comer el doble en la siguiente */
  }
  return {restante:restante, maximo:maximo, objetivo:objetivo};
}
function aTotales(){
  var k=0,p=0;

}

/* ---------- evaluación de una receta con lo que hay en la despensa ---------- */
function aEval(r){
  var k=0,p=0,faltan=0,items=[];
  r.slots.forEach(function(sl){
    var uso=null;
    for(var i=0;i<sl.alts.length;i++){ if(despensa[sl.alts[i].id]){ uso=sl.alts[i]; break; } }
    var ok=!!uso;
    if(!uso){ uso=sl.alts[0]; faltan++; }
    var f=AF[uso.id];
    k+=f.k*uso.q; p+=f.p*uso.q;
    var txt = ok ? aCorto(f.nom) : (sl.label || sl.alts.map(function(a){return aCorto(AF[a.id].nom);}).join(" o "));
    items.push({ok:ok,txt:txt,ic:f.ic,falta:sl});
  });
  return {r:r,k:Math.round(k),p:Math.round(p),faltan:faltan,items:items};
}
function aDelPool(pool){ return A_REC.filter(function(r){return r.p===pool;}); }

/* qué alimento sumar para habilitar más opciones de un pool */
function aSugerir(pool){
  var cuenta={};
  aDelPool(pool).forEach(function(r){
    var e=aEval(r);
    if(e.faltan!==1){ return; }
    e.items.forEach(function(it){
      if(!it.ok){ it.falta.alts.forEach(function(a){ cuenta[a.id]=(cuenta[a.id]||0)+1; }); }
    });
  });
  var arr=Object.keys(cuenta).map(function(id){return {id:id,n:cuenta[id]};});
  arr.sort(function(a,b){return b.n-a.n;});
  return arr.slice(0,2);
}

/* ---------- plato abierto: cantidades y alternativas editables ---------- */
function aAbrirPlato(secId,recId){
  var rec=aRecDe(recId), ya=sel[secId];
  var ids=[], qs=[];
  rec.slots.forEach(function(sl,i){
    if(ya && ya.r===recId && ya.ids){ ids.push(ya.ids[i]); qs.push(ya.qs[i]); return; }
    var uso=null;
    for(var j=0;j<sl.alts.length;j++){ if(despensa[sl.alts[j].id]){ uso=sl.alts[j]; break; } }
    if(!uso){ uso=sl.alts[0]; }
    ids.push(uso.id); qs.push(uso.q);
  });
  aPl={sec:secId,rec:rec,ids:ids,qs:qs}; aPasos={};
}
function aCalcPl(){
  var k=0,p=0,c=0,faltan=0,items=[];
  aPl.rec.slots.forEach(function(sl,i){
    var f=AF[aPl.ids[i]], q=aPl.qs[i];
    var ok=!!despensa[f.id];
    if(!ok){ faltan++; }
    k+=f.k*q; p+=f.p*q; c+=f.c*q;
    var disp=sl.alts.filter(function(a){ return despensa[a.id]; });
    items.push({f:f,q:q,ok:ok,ic:f.ic,mas:disp.length>1,slot:sl});
  });
  return {k:Math.round(k),p:Math.round(p),c:Math.round(c),faltan:faltan,items:items};
}

  else if(est==="bajo"){ tit="Quedaste "+aMiles(-dif)+" kcal abajo"; msg="Para bajar de peso suma, pero comer tan poco te deja sin energía para entrenar y cuesta sostenerlo. Mañana apuntá más cerca de "+aMiles(A_KCAL)+"."; }
  else if(dif>0){ tit="Un poquito arriba, dentro del margen"; msg="Estás a "+aMiles(dif)+" kcal del objetivo: bien."; }
  else if(dif>-60){ tit="Justo en el objetivo"; msg="Día redondo."; }
  else { tit="Dentro del objetivo"; msg="Quedaron "+aMiles(-dif)+" kcal sin usar: para bajar de peso está bien."; }
  var pm = p<A_PMIN ? "Te faltaron "+(A_PMIN-p)+" g de proteína para el mínimo ("+A_PMIN+" g)." : (p>A_PMAX ? "Proteína por encima del rango: sin problema." : "Proteína en rango.");
  var pk=Math.min(100,Math.round(k/A_KCAL*100)), pp=Math.min(100,Math.round(p/200*100));
  var h='<p class="eyebrow">Resumen del día</p><h2 class="asht">Cerrar el día</h2>'+
    '<div class="afk"><div class="akcal tnum">'+aMiles(k)+'<small> / '+aMiles(A_KCAL)+' kcal</small></div>'+
    '<div class="abar"><i style="width:'+pk+'%;background:'+(est==="alto"?'var(--accent)':(est==="bajo"?'var(--amber)':'var(--done)'))+'"></i></div></div>'+
    '<div class="afk"><div class="akcal tnum" style="font-size:30px">'+p+'<small> g de proteína</small></div>'+
    '<div class="abar prot"><span class="zona" style="left:'+(A_PMIN/2)+'%;width:'+((A_PMAX-A_PMIN)/2)+'%"></span><i style="width:'+pp+'%;background:'+((p>=A_PMIN)?'var(--done)':'var(--amber)')+'"></i></div></div>'+
    '<div class="afmsg '+est+'"><b>'+tit+'</b><span>'+msg+' '+pm+'</span></div>';
  h+='<div class="afl">';
  A_SECC.forEach(function(s){
    var e=sel[s.id]; if(!e||e.skip){ return; }
    h+='<div class="smeal"><span class="smn">'+esc(s.n.replace("Intervalo de ",""))+'</span><em>'+esc(e.n)+'</em><b class="tnum">'+aMiles(e.k)+'</b></div>';
  });
  h+='</div><button type="button" class="abtn verde" data-act="finok">Guardar y cerrar el día</button>'+
     '<button type="button" class="reset" data-act="sclose">Seguir editando</button>';
  return h;
}
