<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Franco">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;background:#000}</style>
<title>Rutina de Franco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;600;700;800&display=swap">
<style>
  /* Layout: tres vistas apiladas (semana, dia, paso) con barra inferior fija */
  :root{
    --bg:#000000;
    --card:rgba(255,255,255,0.055);
    --card2:rgba(255,255,255,0.02);
    --line:rgba(255,255,255,0.11);
    --fg:#FFFFFF;
    --muted:rgba(255,255,255,0.45);
    --muted2:rgba(255,255,255,0.62);
    --accent:#FF3B30;
    --accent-lt:#FF6A60;
    --amber:#F5B13D;
    --done:#3E9E78;
    --done-lt:#6FC4A2;
    --inert:#171B21;
    --display:Anton,'Manrope',sans-serif;
    --ui:Manrope,system-ui,-apple-system,sans-serif;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  button[disabled]{cursor:default}
  a{color:var(--accent);text-decoration:none}

  .app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
  .view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .view[hidden]{display:none!important}
  .pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

  .eyebrow{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0}
  .anton{font-family:var(--display);font-weight:400;letter-spacing:.01em}
  .tnum{font-variant-numeric:tabular-nums}

  /* ---------- semana ---------- */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-top:28px;padding-bottom:16px}
  .topbar h1{margin:5px 0 0;font-size:42px;line-height:.9;text-transform:uppercase}
  .clock{font-family:var(--display);font-size:29px;line-height:1}
  .fecha{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-top:5px;text-transform:uppercase}

  .hoy{position:relative;display:block;height:208px;border-radius:24px;overflow:hidden;color:inherit;border:1px solid var(--line)}
  .hoy img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hoy .veil{position:absolute;inset:0;background:linear-gradient(105deg,rgba(0,0,0,.94) 30%,rgba(0,0,0,.6) 62%,rgba(0,0,0,.3) 100%)}
  .hoy .inner{position:absolute;inset:0;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between}
  .badge{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:var(--accent);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;box-shadow:0 4px 14px rgba(255,59,48,.45)}
  .hoy .name{font-family:var(--display);font-size:38px;line-height:.9;text-transform:uppercase}
  .hoy .musc{font-size:13.5px;font-weight:600;color:var(--muted2);margin-top:5px}
  .cta{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;background:var(--accent);color:#fff;border:none;font-size:14px;font-weight:800;box-shadow:0 8px 24px rgba(255,59,48,.5)}

  .rest{height:208px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%);padding:22px 20px;display:flex;flex-direction:column;justify-content:center}
  .rest .name{font-family:var(--display);font-size:38px;line-height:.9;margin-top:10px;text-transform:uppercase}

  .seclabel{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}

  .daylist{display:flex;flex-direction:column;gap:7px;padding-bottom:16px}
  .dayrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%);padding:0 15px;min-height:56px;color:inherit}
  .dayrow.on{border-color:rgba(255,59,48,.55);background:linear-gradient(130deg,rgba(255,59,48,.16) 0%,rgba(255,59,48,.03) 70%)}
  .dtag{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07);font-family:var(--display);font-size:13px;text-transform:uppercase;color:var(--muted)}
  .dayrow.on .dtag{background:var(--accent);color:#fff}
  .dname{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.25}
  .dser{flex:none;font-family:var(--display);font-size:19px;color:var(--muted)}
  .dayrow.on .dser{color:#fff}

  /* ---------- dia ---------- */
  .dayhead{position:relative;overflow:hidden}
  .dayhead .bg{position:absolute;left:0;top:0;width:100%;height:300px;overflow:hidden}
  .dayhead .bg img{width:100%;height:200px;object-fit:cover;display:block}
  .dayhead .bg .veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.74) 0%,rgba(0,0,0,.5) 22%,rgba(0,0,0,.86) 52%,#000 76%)}
  .dayhead .fg{position:relative;padding-top:22px;padding-bottom:14px}

  .back{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px 0 11px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .dayhead h1{margin:6px 0 0;font-family:var(--display);font-size:44px;line-height:.88;text-transform:uppercase}

  .fase{display:flex;align-items:center;gap:9px;margin:16px 0 9px}
  .fase .t{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .fase .l{flex:1;height:1px;background:rgba(255,255,255,.1)}

  .exlist{display:flex;flex-direction:column;gap:7px}
  .exrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%);padding:0 15px;min-height:58px;color:inherit}
  .exrow.next{border-color:rgba(255,59,48,.55);background:linear-gradient(130deg,rgba(255,59,48,.17) 0%,rgba(255,59,48,.03) 72%)}
  .exrow.hecho{border-color:rgba(62,158,120,.42);background:linear-gradient(140deg,rgba(62,158,120,.13) 0%,rgba(62,158,120,.02) 75%)}
  .exrow.bloq{opacity:.42;background:rgba(255,255,255,.022);border-color:rgba(255,255,255,.07)}
  .exrow.bloq .exnum{background:rgba(255,255,255,.04);color:rgba(255,255,255,.3)}
  .exnum{flex:none;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.07);font-family:var(--display);font-size:17px;color:var(--muted)}
  .exrow.next .exnum{background:var(--accent);color:#fff;box-shadow:0 5px 16px rgba(255,59,48,.45)}
  .exrow.hecho .exnum{background:rgba(62,158,120,.2);color:var(--done-lt)}
  .exrow.cardio .exnum{background:rgba(245,177,61,.16);color:var(--amber)}
  .exrow.cardio.next .exnum{background:var(--accent);color:#fff}
  .exrow.cardio.hecho .exnum{background:rgba(62,158,120,.2);color:var(--done-lt)}
  .exname{flex:1;min-width:0}
  .exname b{display:block;font-size:15.5px;font-weight:800;line-height:1.15}
  .exname span{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .exrow.hecho .exname b{color:rgba(255,255,255,.72)}
  .exrow.hecho .exname span{color:var(--done-lt)}
  .exvol{flex:none;font-family:var(--display);font-size:19px;color:rgba(255,255,255,.78)}
  .exrow.next .exvol{color:#fff}
  .exrow.hecho .exvol{color:rgba(255,255,255,.4)}
  .vcount{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.1);font-family:var(--ui);font-size:9.5px;font-weight:800;color:var(--muted);vertical-align:2px}

  .diadone{margin-top:14px;display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:16px;border:1px solid rgba(62,158,120,.45);background:linear-gradient(140deg,rgba(62,158,120,.16) 0%,rgba(62,158,120,.03) 75%)}

  /* ---------- paso ---------- */
  .exwrap{position:relative;min-height:100%;display:flex;flex-direction:column}
  .hero{position:absolute;left:0;top:0;width:100%;height:500px;overflow:hidden;pointer-events:none}
  .heroimgs{position:relative;width:100%;height:310px}
  .heroimgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #ejImg1{opacity:0}
  .hero .veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 18%,rgba(0,0,0,.5) 44%,rgba(0,0,0,.86) 62%,rgba(0,0,0,.99) 80%,#000 100%)}
  .hero .warmth{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(90,14,10,0) 20%,rgba(90,14,10,.15) 46%,rgba(90,14,10,0) 72%);mix-blend-mode:screen}

  .extop{position:relative;height:292px;flex:none}
  .roundbtn{position:absolute;top:18px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.16);color:#fff}
  .pill{position:absolute;top:18px;display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 16px;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.16);font-size:12.5px;font-weight:800}
  .extitle{position:absolute;bottom:8px;left:0;right:0}
  .extitle h1{margin:10px 0 0;font-family:var(--display);font-size:44px;line-height:.86;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.6)}
  .kindicon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;background:var(--accent);box-shadow:0 6px 22px rgba(255,59,48,.55)}
  .kindicon.amber{background:var(--amber);box-shadow:0 6px 22px rgba(245,177,61,.5)}

  .stats{position:relative;flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
  .stats>div{padding:11px 0 13px}
  .stats>div+div{padding-left:16px;border-left:1px solid var(--line)}
  .stats .k{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5)}
  .stats .v{font-family:var(--display);font-size:37px;line-height:.92;margin-top:6px}
  [hidden]{display:none!important}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:50;max-width:min(340px,calc(100vw - 32px));padding:12px 16px;border-radius:14px;background:#1C1C20;border:1px solid rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:700;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.6);opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .2s,transform .2s}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .reset{display:block;margin:14px auto 0;padding:10px 14px;background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
  .stats .sm{font-size:21px;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
  .stats.wide{grid-template-columns:.85fr 1.6fr 1.15fr}
  .regla{display:flex;gap:11px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(245,177,61,.10);border:1px solid rgba(245,177,61,.38)}
  .regla b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
  .regla span{display:block;margin-top:4px;font-size:12.5px;line-height:1.4;color:var(--muted2)}
  .pruebabtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;margin-top:10px;border-radius:14px;border:1px dashed rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.7);font-size:12.5px;font-weight:800}
  .pruebabtn i{font-style:normal;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.14);color:#fff}
  .stats .hot .k{color:#FF8A82}
  .stats .hot .v{color:#FF4A3F;text-shadow:0 0 22px rgba(255,59,48,.55)}

  .vtabs{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}
  .vtab{min-height:46px;border-radius:15px;padding:0 12px;text-align:center;font-size:13.5px;font-weight:800;background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%);color:var(--muted2);border:1px solid rgba(255,255,255,.12)}
  .vtab.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 20px rgba(255,59,48,.42)}

  .body{position:relative;flex:1;min-height:216px;display:flex;align-items:center;justify-content:center;padding:10px 0}
  .halo{position:absolute;width:228px;height:228px;border-radius:50%;background:radial-gradient(circle,rgba(255,59,48,.18) 0%,rgba(255,59,48,0) 68%)}
  .bodysvg{position:relative;display:flex;gap:2px;width:198px}
  .bodysvg svg{width:50%;height:auto;display:block}
  .m{fill:var(--inert);stroke:#06070A;stroke-width:.35}
  .m.p1{fill:var(--accent);filter:drop-shadow(0 0 3.5px rgba(255,59,48,.95))}
  .m.p2{fill:var(--amber);filter:drop-shadow(0 0 2.5px rgba(245,177,61,.8))}

  .mlabel{position:absolute;display:flex;flex-direction:column;gap:3px}
  .mlabel.pri{left:0;top:2px}
  .mlabel.sec{right:0;bottom:4px;text-align:right}
  .mlabel .row{display:inline-flex;align-items:center;gap:7px}
  .mlabel.sec .row{justify-content:flex-end}
  .dot{width:9px;height:9px;border-radius:50%}
  .dot.a{background:var(--accent);box-shadow:0 0 13px rgba(255,59,48,1)}
  .dot.b{background:var(--amber);box-shadow:0 0 13px rgba(245,177,61,.95)}
  .mlabel .t{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5)}
  .mlabel .n{font-family:var(--display);font-size:20px;line-height:1.1;text-transform:uppercase}
  .mlabel.pri .n{color:#FF4A3F;text-shadow:0 0 24px rgba(255,59,48,.7);margin-left:16px}
  .mlabel.sec .n{color:var(--amber);text-shadow:0 0 20px rgba(245,177,61,.5);margin-right:16px;font-size:16px}

  .timer{position:relative;flex:1;min-height:216px;display:flex;align-items:center;justify-content:center}
  .timer .halo{width:290px;height:290px;background:radial-gradient(circle,rgba(255,59,48,.24) 0%,rgba(255,59,48,0) 66%)}
  .timer.verde .halo{background:radial-gradient(circle,rgba(245,177,61,.2) 0%,rgba(245,177,61,0) 66%)}
  .timer .in{position:relative;text-align:center}
  .timer .big{font-family:var(--display);font-size:88px;line-height:.86;margin-top:6px;text-shadow:0 0 48px rgba(255,59,48,.8)}
  .timer.verde .big{text-shadow:0 0 48px rgba(245,177,61,.6)}
  .timer .lab{font-size:11px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:#FF8A82}
  .timer.verde .lab{color:var(--amber)}
  .bar{width:224px;height:6px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin:15px auto 0}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--accent);box-shadow:0 0 14px rgba(255,59,48,1)}
  .timer.verde .bar i{background:var(--amber);box-shadow:0 0 14px rgba(245,177,61,.9)}
  .tbtns{display:flex;gap:10px;justify-content:center;margin-top:15px}
  .tbtn{min-height:46px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;font-size:13.5px;font-weight:800}
  .tbtn.hot{border:none;background:var(--accent);box-shadow:0 8px 24px rgba(255,59,48,.5);padding:0 26px}
  .tbtn.amber{border:none;background:var(--amber);color:#17120A;box-shadow:0 8px 24px rgba(245,177,61,.4);padding:0 28px}

  .note{position:relative;display:flex;gap:11px;align-items:flex-start;border-radius:16px;border:1px solid rgba(255,59,48,.35);background:linear-gradient(130deg,rgba(255,59,48,.14) 0%,rgba(255,59,48,.02) 75%);padding:12px 15px;margin-top:11px}

  .sets{position:relative;padding:12px 0 18px}
  .setgrid{display:grid;gap:8px;margin-top:9px}
  .setbtn{position:relative;display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:16px;font-family:var(--display);font-size:23px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.26)}
  .setbtn.next{background:rgba(255,255,255,.07);border:1px solid rgba(255,59,48,.65);color:#fff;box-shadow:0 0 0 3px rgba(255,59,48,.1)}
  .setbtn.done{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(255,59,48,.4)}
  .setbtn .chk{position:absolute;top:5px;right:7px;opacity:.9}

  .bigbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;border-radius:16px;border:none;margin-top:10px;font-size:15px;font-weight:800}
  .bigbtn.verde{background:var(--done);color:#fff;box-shadow:0 8px 24px rgba(62,158,120,.4)}
  .bigbtn.roja{background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(255,59,48,.45)}

  /* ---------- barra inferior ---------- */
  .tabbar{flex:none;height:78px;border-top:1px solid rgba(255,255,255,.07);background:#0A0A0C;display:flex;align-items:center;justify-content:space-around;padding:0 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .tab{display:flex;align-items:center;justify-content:center;width:48px;height:48px;background:none;border:none;color:rgba(255,255,255,.4);padding:0}
  .tab.on{color:var(--accent)}
  .tabmain{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;background:var(--accent);border:none;box-shadow:0 8px 22px rgba(255,59,48,.5)}



  /* ---------- cortes de la vaca ---------- */
  .vaca{display:block;width:100%;height:auto;overflow:visible}
  .vaca .vb{fill:rgba(255,255,255,.12);stroke:rgba(255,255,255,.4);stroke-width:1.6;stroke-linejoin:round}
  .vaca .vz polygon{fill:var(--accent);stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
  .atile .vaca{width:92px;height:54px;margin-top:2px;flex:none}
  .atile.on .vaca .vb{fill:rgba(62,158,120,.18)}
  .ainf{position:absolute;top:4px;left:4px;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font:italic 800 13px/1 Georgia,serif;color:var(--muted2)}
  .ainf::before{content:"";position:absolute;inset:4px;border-radius:50%;background:rgba(255,255,255,.1);z-index:-1}
  .avbig{margin:14px 0 6px;padding:14px 10px 10px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
  .avbig .vaca{width:100%}
  .avnota{font-size:11px;text-align:center;margin:0 4px 10px}
  .ainfo{margin:10px 2px 14px;font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.82)}
  .apor{margin:0 0 6px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
  .apor3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .apor3 b{display:block;font-family:var(--display);font-size:26px;line-height:1}
  .apor3 small{display:block;margin-top:3px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  /* ---------- hoja inferior ---------- */
  .asheet{position:absolute;inset:0;z-index:40;visibility:hidden;pointer-events:none;transition:visibility 0s .25s}
  .asheet.on{visibility:visible;pointer-events:auto;transition:none}
  .asback{position:absolute;inset:0;background:rgba(0,0,0,.66);opacity:0;transition:opacity .22s}
  .asheet.on .asback{opacity:1}
  .aspanel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.14);background:#131316;box-shadow:0 -20px 50px rgba(0,0,0,.6);transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.25,1)}
  .asheet.on .aspanel{transform:none}
  .asgrab{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:0 auto 16px}
  .asht{margin:6px 0 0;font-family:var(--display);font-size:34px;line-height:.95;text-transform:uppercase}

  /* ---------- cerrar el día ---------- */
  .abtn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none;color:var(--fg)}
  .abtn.verde{background:var(--done);box-shadow:0 8px 24px rgba(62,158,120,.4)}
  .acerr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:13px 14px;border-radius:18px;border:1px solid rgba(62,158,120,.55);background:linear-gradient(135deg,rgba(62,158,120,.22),rgba(62,158,120,.04) 80%)}
  .acerr b{display:block;font-size:14px;color:var(--done-lt)}
  .acerr span{display:block;margin-top:2px;font-size:12.5px;font-weight:600;color:var(--muted2)}
  .acerrb{display:flex;flex-direction:column;align-items:flex-end}
  .acerrb .alink{margin:0;padding:5px 6px}
  .afk{margin-top:18px}
  .afmsg{margin:18px 0 12px;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
  .afmsg b{display:block;font-size:15px}
  .afmsg span{display:block;margin-top:4px;font-size:13px;line-height:1.45;color:var(--muted2)}
  .afmsg.ok{border-color:rgba(62,158,120,.55);background:rgba(62,158,120,.1)} .afmsg.ok b{color:var(--done-lt)}
  .afmsg.alto{border-color:rgba(255,59,48,.5);background:rgba(255,59,48,.09)} .afmsg.alto b{color:var(--accent-lt)}
  .afmsg.bajo{border-color:rgba(245,177,61,.5);background:rgba(245,177,61,.08)} .afmsg.bajo b{color:var(--amber)}
  .afl{margin-bottom:4px}
  .smeal{display:grid;grid-template-columns:78px minmax(0,1fr) auto;align-items:baseline;gap:8px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07);font-size:13px}
  .smeal .smn{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .smeal em{font-style:normal;font-weight:600;color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .smeal b{font-weight:800}

  /* ---------- mi semana (comida) ---------- */
  .snav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:2px 0 14px}
  .snav button{height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:22px;line-height:1}
  .snav button:disabled{opacity:.25}
  .snav div{text-align:center}
  .snav b{display:block;font-size:15px}
  .snav span{display:block;margin-top:1px;font-size:12px;font-weight:700;color:var(--muted2)}
  .sstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:20px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%)}
  .sstats>div{padding:14px 12px}
  .sstats>div+div{border-left:1px solid var(--line)}
  .sstats b{display:block;font-family:var(--display);font-size:27px;line-height:1}
  .sstats b small{font-family:var(--ui);font-size:12px;font-weight:800;color:var(--muted)}
  .sstats span{display:block;margin-top:5px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .schart{position:relative;margin-top:14px;padding:22px 14px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
  .sgrid{position:absolute;left:14px;right:14px;top:22px;height:124px;pointer-events:none}
  .sline{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(255,255,255,.38)}
  .sline span{position:absolute;right:0;bottom:2px;font-size:9.5px;font-weight:800;color:rgba(255,255,255,.55);background:#0a0a0c;padding:0 3px}
  .sbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .sbc{position:relative;height:124px;display:flex;align-items:flex-end;justify-content:center}
  .sbc i{position:relative;display:block;width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:rgba(255,255,255,.3)}
  .sbc i.ok{background:var(--done)} .sbc i.alto{background:var(--accent)} .sbc i.bajo{background:var(--amber)} .sbc i.curso{background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.22))}
  .sbc i b{text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000;position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:3px;font-size:10px;font-weight:800;color:var(--muted2);white-space:nowrap}
  .sbc u{display:block;width:100%;max-width:34px;height:3px;border-radius:3px;background:rgba(255,255,255,.1)}
  .sl{display:block;margin-top:8px;text-align:center;font-family:var(--display);font-size:15px;color:var(--muted)}
  .sbar.dhoy .sl{color:var(--accent-lt)}
  .sbar.fut{opacity:.45}
  .sleg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:10px 2px 0;font-size:11px;color:var(--muted)}
  .sleg .lg{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:-4px;background:rgba(255,255,255,.4)}
  .lg.ok{background:var(--done)!important} .lg.alto{background:var(--accent)!important} .lg.bajo{background:var(--amber)!important}
  .srows{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .srow{border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%);overflow:hidden}
  .srow.dhoy{border-color:rgba(255,59,48,.55)}
  .srow.fut{opacity:.45}
  .sbtn{display:grid;grid-template-columns:minmax(0,1fr) auto 62px;align-items:center;gap:10px;width:100%;min-height:58px;padding:8px 14px;background:none;border:none;color:inherit;text-align:left}
  .sdn b{display:block;font-size:14.5px}
  .sdn span{display:block;margin-top:2px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .srow.ok .sdn span{color:var(--done-lt)} .srow.alto .sdn span{color:var(--accent-lt)} .srow.bajo .sdn span{color:var(--amber)}
  .skv{font-family:var(--display);font-size:21px;text-align:right}
  .skv small{font-family:var(--ui);font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .spc{justify-self:end;min-width:56px;padding:5px 0;border-radius:9px;background:rgba(255,255,255,.07);text-align:center;font-size:12px;font-weight:800;color:var(--muted2)}
  .spc.ok{background:rgba(62,158,120,.2);color:var(--done-lt)} .spc.bajo{background:rgba(245,177,61,.16);color:var(--amber)}
  .spb{height:3px;margin:0 14px;border-radius:3px;background:rgba(255,255,255,.07)}
  .spb i{display:block;height:100%;border-radius:3px;background:rgba(255,255,255,.4)}
  .srow.ok .spb i{background:var(--done)} .srow.alto .spb i{background:var(--accent)} .srow.bajo .spb i{background:var(--amber)}
  .sdet{display:none;padding:4px 14px 8px}
  .srow.open .sdet{display:block}
  .srow:not(.open) .spb{margin-bottom:11px}

  /* ---------- alimentación ---------- */
  .ic{display:block;flex:none;background-size:contain;background-repeat:no-repeat;background-position:center}
  .ares{padding:18px 18px 16px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%)}
  .akcal{font-family:var(--display);font-size:46px;line-height:.95;margin-top:6px}
  .akcal small{font-family:var(--ui);font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .abar{position:relative;height:9px;margin-top:12px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
  .abar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .35s}
  .abar .zona{position:absolute;top:0;bottom:0;background:rgba(62,158,120,.35);border-left:1px solid rgba(111,196,162,.7);border-right:1px solid rgba(111,196,162,.7)}
  .abar.prot i{z-index:1;opacity:.95}
  .aescala{position:relative;height:14px;margin-top:5px;font-size:10px;font-weight:800;color:var(--muted)}

  .asegm{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px -20px 0;padding:10px 20px 10px;background:linear-gradient(#000 78%,rgba(0,0,0,0))}
  .asegm button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--muted2);font-size:14px;font-weight:800}
  .asegm button em{font-style:normal;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff}
  .asegm button.on{border-color:rgba(255,59,48,.65);background:linear-gradient(130deg,rgba(255,59,48,.22),rgba(255,59,48,.06));color:#fff;box-shadow:0 6px 18px rgba(255,59,48,.18)}
  .asegm button.on em{background:var(--accent)}

  /* despensa */
  .acatbar{position:relative;display:flex;gap:8px;overflow-x:auto;margin:2px -20px 0;padding:4px 20px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .acatbar::-webkit-scrollbar{display:none}
  .acatb{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 9px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:inherit}
  .acatb .ic{width:38px;height:38px}
  .acatb b{font-size:10.5px;font-weight:800;line-height:1.15;text-align:center;min-height:24px;display:flex;align-items:center}
  .acatb em{font-style:normal;font-size:10px;font-weight:800;color:var(--muted)}
  .acatb.has em{color:var(--done-lt)}
  .acatb.sel{border-color:rgba(255,59,48,.65);background:linear-gradient(160deg,rgba(255,59,48,.2),rgba(255,59,48,.04))}
  .acathead{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(130deg,rgba(255,59,48,.14) 0%,rgba(255,255,255,.02) 70%)}
  .acathead.gus{background:linear-gradient(130deg,rgba(245,177,61,.16) 0%,rgba(255,255,255,.02) 70%);border-color:rgba(245,177,61,.3)}
  .ic.big{width:64px;height:64px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
  .acn{font-family:var(--display);font-size:27px;line-height:1;text-transform:uppercase}
  .act{margin-top:5px;font-size:12px;font-weight:600;line-height:1.35;color:var(--muted2)}
  .acatctl{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 10px}
  .alink{padding:6px 10px;margin-left:4px;background:none;border:none;color:var(--accent-lt);font-size:12px;font-weight:800}
  .agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .asubh{grid-column:1/-1;margin:10px 2px 0;font-size:13px;font-weight:800;color:var(--muted2)}
  .asubh:first-child{margin-top:0}
  .asearch{display:flex;align-items:center;gap:10px;min-height:48px;margin:2px 0 12px;padding:0 14px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted2)}
  .asearch input{flex:1;min-width:0;height:46px;border:none;outline:none;background:none;color:#fff;font-family:inherit;font-size:15px;font-weight:600}
  .asearch input::placeholder{color:var(--muted)}
  .asearch:focus-within{border-color:rgba(255,59,48,.65)}
  .atile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;min-height:118px;padding:12px 6px 10px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:rgba(255,255,255,.78);text-align:center}
  .atile .ic{width:54px;height:54px;opacity:.78;filter:saturate(.75)}
  .atile span:last-child{font-size:12px;font-weight:700;line-height:1.2}
  .atile.on{border-color:rgba(62,158,120,.8);background:linear-gradient(160deg,rgba(62,158,120,.26),rgba(62,158,120,.06));color:#fff}
  .atile.on .ic{opacity:1;filter:none}
  .atck{position:absolute;top:7px;right:7px;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--done);color:#fff}
  .atck svg{width:12px;height:12px}

  /* comidas */
  .aeleg{display:flex;align-items:center;gap:11px;margin-top:10px;padding:11px 13px;border-radius:16px;border:1px solid rgba(62,158,120,.5);background:rgba(62,158,120,.12)}
  .aeleg b{display:block;font-size:13.5px;font-weight:800;line-height:1.25}
  .aeleg span span{display:block;font-size:11px;font-weight:700;color:var(--done-lt);margin-top:2px}
  .anota{margin:0;font-size:12.5px;line-height:1.4;color:var(--muted2)}
  .asub{margin:18px 2px 8px;font-size:13px;font-weight:800;color:var(--muted2)}
  .asum{margin:12px 0 0;padding:11px 13px;border-radius:13px;background:rgba(245,177,61,.09);border:1px solid rgba(245,177,61,.3);font-size:12.5px;line-height:1.4;color:var(--muted2)}
  .asum b{color:var(--amber);font-weight:800}
  .avacio{margin:12px 0 0;padding:16px;border-radius:16px;border:1px dashed rgba(255,255,255,.2);font-size:13px;line-height:1.45;color:var(--muted2)}
  .aopc{margin-top:8px;padding:14px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015))}
  .aopc.no{opacity:.8}
  .aopc.sel{border-color:rgba(62,158,120,.7);background:linear-gradient(160deg,rgba(62,158,120,.18),rgba(62,158,120,.04))}
  .aoprow{display:flex;align-items:center;gap:14px}
  .aopinfo{flex:1;min-width:0}
  .aname{display:block;font-size:15px;font-weight:800;line-height:1.25}
  .aopnum{display:flex;align-items:baseline;gap:10px;margin-top:6px;flex-wrap:wrap}
  .avol{font-family:var(--display);font-size:22px;line-height:1;color:#fff}
  .avol small{font-family:var(--ui);font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .aprot{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
  .agusto{display:inline-block;margin-bottom:5px;padding:3px 8px;border-radius:6px;background:rgba(245,177,61,.18);color:var(--amber);font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  .ings{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .ing{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.2}
  .ing.ok{background:rgba(62,158,120,.16);color:#CFEEDF}
  .ing.ok .ck{display:inline-flex;color:var(--done-lt)}
  .ing.no{border:1px dashed rgba(255,106,96,.6);color:#FF8A82}
  .abtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;margin-top:12px;border-radius:13px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:800;box-shadow:0 6px 18px rgba(255,59,48,.4)}
  .abtn.elegida{background:var(--done);box-shadow:0 6px 18px rgba(62,158,120,.35)}
  .afalta{margin-top:12px;font-size:11.5px;font-weight:800;color:#FF8A82}

  /* plato */
  .plato{position:relative;flex:none;width:104px;height:104px}
  .plato .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,#FFFFFF 0%,#EEF0F3 45%,#CDD1D8 100%);box-shadow:0 10px 22px rgba(0,0,0,.6),inset 0 -3px 6px rgba(0,0,0,.12)}
  .plato .disc::after{content:"";position:absolute;inset:11%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F7F8FA,#E1E4E9);box-shadow:inset 0 2px 5px rgba(0,0,0,.14)}
  .plato.listo .disc{box-shadow:0 0 0 2.5px var(--done),0 10px 22px rgba(0,0,0,.6),inset 0 -3px 6px rgba(0,0,0,.12)}
  .plato .ic{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));z-index:1}
  .plato .ic.ghost{filter:grayscale(1) opacity(.3);}


  /* hero de alimentación (misma línea que Día / Ejercicio) */
  .alihero{position:relative;height:206px;margin:0 -20px;padding:30px 20px 0;overflow:hidden;background:radial-gradient(120% 95% at 88% 8%,rgba(255,59,48,.42),rgba(255,59,48,0) 62%),radial-gradient(70% 60% at 6% 100%,rgba(245,177,61,.12),rgba(245,177,61,0) 70%),#000}
  .alihero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(to bottom,rgba(0,0,0,0),#000)}
  .alihero .aht{position:relative;z-index:2}
  .alihero h1{margin:8px 0 0;font-family:var(--display);font-size:44px;line-height:.9;text-transform:uppercase}
  .alihero .hsub{margin:12px 0 0;max-width:190px;font-size:13.5px;font-weight:600;line-height:1.35;color:var(--muted2)}
  .alihero .ic{position:absolute;filter:drop-shadow(0 12px 14px rgba(0,0,0,.55))}
  .ah1{width:128px;height:128px;right:-14px;top:18px;transform:rotate(14deg)}
  .ah2{width:82px;height:82px;right:104px;top:104px;transform:rotate(-10deg)}
  .ah3{width:108px;height:108px;right:6px;top:108px;transform:rotate(-20deg);z-index:1}
  .acc{color:#FF8A82}
  .stats small{font-family:var(--ui);font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .stats .hot small{color:#FF8A82}

  /* el día en bloques: cada comida es un bloque cuya altura sigue sus calorías */
  .lbl{margin:0;font-size:12.5px;font-weight:700;color:var(--muted2)}
  .adia{position:relative;margin-top:4px}
  .adia::before{content:"";position:absolute;left:66px;top:18px;bottom:18px;width:2px;border-radius:2px;background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.05))}
  .dslot{position:relative;display:grid;grid-template-columns:56px 20px minmax(0,1fr);align-items:start;margin-bottom:9px}
  .dhora{padding-top:15px;font-family:var(--display);font-size:18px;line-height:1;color:var(--muted)}
  .dpt{position:relative;z-index:1;justify-self:center;margin-top:17px;width:12px;height:12px;border-radius:50%;background:#000;border:2px solid rgba(255,255,255,.32)}
  .dblk{display:flex;flex-direction:column;justify-content:space-between;gap:8px;width:100%;min-height:var(--h,110px);padding:14px 14px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:inherit;text-align:left;transition:min-height .3s}
  .dtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .dname{display:block;min-width:0}
  .dname b{display:block;font-size:17px;font-weight:800;line-height:1.12}
  .dname span{display:block;margin-top:4px;font-size:12.5px;font-weight:600;line-height:1.3;color:var(--muted2)}
  .dblk .mic{flex:none;width:46px;height:46px;margin:-2px -2px 0 0}
  .dfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .ddish{font-size:13px;font-weight:700;line-height:1.3;color:rgba(255,255,255,.86);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dk{flex:none;font-family:var(--display);font-size:30px;line-height:.9;color:#fff}
  .dk small{font-family:var(--ui);font-size:11px;font-weight:800;color:var(--muted)}
  .dtag{align-self:flex-start;padding:3px 9px;border-radius:7px;background:rgba(255,255,255,.09);font-size:11.5px;font-weight:700;color:var(--muted2)}
  .dslot.next .dblk{border-color:rgba(255,59,48,.6);background:linear-gradient(135deg,rgba(255,59,48,.22),rgba(255,59,48,.03) 78%);box-shadow:0 8px 26px rgba(255,59,48,.16)}
  .dslot.next .dhora{color:#fff}

    "e-z curl bar":"Barra Z","bands":"Bandas","body only":"Peso corporal",
    "kettlebells":"Kettlebell","other":"Otro"
  };
  var DESCANSO=120;
  var MODO_PRUEBA=false; /* true: muestra el botón "Saltar (solo pruebas)" en la bicicleta. Poner false para la versión final. */
  var CHK='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
  var ICO_PESA='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>';
  var ICO_BICI='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17120A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="M6 17l5-9h4"/></svg>';
  var ICO_MOV='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17120A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M6 20v-6M18 20v-6M4 7a8 8 0 0 1 16 0"/></svg>';

  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function expand(l){var o={};(l||[]).forEach(function(n){(MAP[n]||[]).forEach(function(k){o[k]=1;});});return o;}
  function esLista(l){return (l||[]).map(function(n){return ES[n]||n;}).join(", ")||"—";}
  function seriesDe(d){var t=0;d.ejercicios.forEach(function(e){t+=e.series||0;});return t;}
  function mmss(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

  /* ----- pasos: calentamiento + ejercicios + cierre, todo en una secuencia ----- */
  function pasosDe(di){
    var d=RUTINA[di], out=[];
    d.calentamiento.forEach(function(it){
      out.push({tipo:it.tipo||"movilidad",fase:it.fase||"Calentamiento",dato:it,variantes:[it]});
    });
    d.ejercicios.forEach(function(e){
      out.push({tipo:"ejercicio",fase:"Rutina",dato:e,variantes:e.variantes});
    });
    d.vuelta_calma.forEach(function(it){
      out.push({tipo:it.tipo||"cardio",fase:it.fase||"Cierre",dato:it,variantes:[it]});
    });
    return out;
  }
  function metaDe(p){ return (p.tipo==="ejercicio" || p.dato.segundos) ? (p.dato.series||1) : 1; }
  function serieCrono(p){ return p.tipo==="movilidad" && !!p.dato.segundos; }
  function conTimer(p){ return p.tipo==="cardio" || serieCrono(p); }
  function segundosDe(p){ return p.tipo==="cardio" ? p.dato.minutos*60 : (p.dato.segundos||0); }

  var polys=[].slice.call(document.querySelectorAll(".m"));
  var diaIdx=0, pasoIdx=0, varIdx=0, vista="semana", pasos=[];
  var tick=null, restante=0, modo="", corriendo=false, totalTimer=DESCANSO;
  var prog={};
  var LS_KEY="franco_progreso_v1";
  function hoyTxt(){var h=new Date();return h.getFullYear()+"-"+(h.getMonth()+1)+"-"+h.getDate();}
  function cargarProg(){
    try{
      var r=window.localStorage.getItem(LS_KEY);
      if(!r){return;}
      var o=JSON.parse(r);
      if(o && o.fecha===hoyTxt() && o.prog && typeof o.prog==="object"){ prog=o.prog; }
    }catch(e){}
  }
  function guardarProg(){
    try{ window.localStorage.setItem(LS_KEY,JSON.stringify({fecha:hoyTxt(),prog:prog})); }catch(e){}
  }
  cargarProg();
  function key(d,p){return d+"-"+p;}
  function hechasDe(d,p){return prog[key(d,p)]||0;}
  function completo(d,p,ps){return hechasDe(d,p) >= metaDe(ps[p]);}

  /* ---------- navegación ---------- */
  function ir(v){
    vista=v;
    $("vSemana").hidden=v!=="semana";
    $("vDia").hidden=v!=="dia";
    $("vEj").hidden=v!=="paso";
    $("vAli").hidden=v!=="ali";
    $("vCom").hidden=v!=="com";
    $("vPla").hidden=v!=="pla";
    $("vSal").hidden=v!=="sal";
    $("tabHome").classList.toggle("on",v==="semana");
    $("tabDia").classList.toggle("on",v==="dia");
    $("tabFood").classList.toggle("on",v==="ali"||v==="com"||v==="pla");
    $("tabUser").classList.toggle("on",v==="sal");
    var ids={semana:"vSemana",dia:"vDia",paso:"vEj",ali:"vAli",com:"vCom",pla:"vPla",sal:"vSal"};
    $(ids[v]).scrollTop=0;
  }
  document.addEventListener("click",function(ev){
    var b=ev.target.closest("[data-go]");
    if(b){
      var dest=b.getAttribute("data-go");
      if(dest==="dia"){ pararTimer(); abrirDia(diaIdx); } else { pararTimer(); ir(dest); }
    }
  });

  /* ---------- semana ---------- */
  function hoyIndice(){var w=new Date().getDay();return (w>=1&&w<=5)?w-1:-1;}

  function pintarSemana(){
    var now=new Date(), h=now.getHours();
    var saludo="Buenas noches";
    if(h>=5&&h<13){saludo="Buen día";} else if(h>=13&&h<20){saludo="Buenas tardes";}
    $("saludo").textContent=saludo;
    $("reloj").textContent=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    try{ $("fecha").textContent=now.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"short"}); }
    catch(e){ $("fecha").textContent=now.toDateString(); }

    var hi=hoyIndice(), box=$("hoyBox");
    if(hi>=0){
      var d=RUTINA[hi];
      box.innerHTML=
        '<a class="hoy" href="#" data-hoy="1">'+
          '<img src="'+esc(d.ejercicios[0].variantes[0].imgs[0])+'" alt="">'+
          '<span class="veil"></span><span class="inner">'+
            '<span style="display:flex;align-items:center;gap:8px">'+
              '<span class="badge">Hoy</span>'+
              '<span class="eyebrow tnum" style="color:rgba(255,255,255,.6)">'+pasosDe(hi).length+' pasos</span>'+
            '</span>'+
            '<span><span class="name" style="display:block">'+esc(d.dia)+'</span>'+
            '<span class="musc" style="display:block">'+esc(d.musculos.join(" · "))+'</span></span>'+
            '<span style="display:flex;align-items:center;justify-content:space-between;gap:12px">'+
              '<span style="display:flex;align-items:baseline;gap:7px">'+
                '<span class="anton tnum" style="font-size:29px;line-height:1">'+seriesDe(d)+'</span>'+
                '<span class="eyebrow">series</span></span>'+
              '<span class="cta">Empezar<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></span>'+
            '</span>'+
          '</span></a>';
      box.querySelector("[data-hoy]").addEventListener("click",function(ev){ev.preventDefault();abrirDia(hi);});
    } else {
      box.innerHTML='<div class="rest"><span class="eyebrow">Hoy</span>'+
        '<span class="name">Descanso</span>'+
        '<span style="font-size:13.5px;color:var(--muted2);margin-top:8px">Volvés el lunes con pecho, hombro y tríceps.</span></div>';
    }

    var lista=$("daylist"); lista.innerHTML="";
    RUTINA.forEach(function(d,i){
      var b=document.createElement("button");
      b.type="button"; b.className="dayrow"+(i===hi?" on":"");
      b.innerHTML='<span class="dtag">'+esc(d.dia.slice(0,3))+'</span>'+
        '<span class="dname">'+esc(d.musculos.join(" · "))+'</span>'+
        '<span class="dser tnum">'+seriesDe(d)+'</span>';
      b.addEventListener("click",function(){abrirDia(i);});
      lista.appendChild(b);
    });
  }

  /* ---------- día ---------- */
  function proximoPendiente(di,ps){
    for(var i=0;i<ps.length;i++){ if(!completo(di,i,ps)){ return i; } }
    return -1;
  }

  function abrirDia(i){
    diaIdx=i; pasos=pasosDe(i);
    var d=RUTINA[i];
    $("diaImg").src=d.ejercicios[0].variantes[0].imgs[0];
    $("diaKicker").textContent="Día "+(i+1)+" · "+d.nombre;
    $("diaNombre").textContent=d.dia;
    $("diaMusc").textContent=d.musculos.join(" · ");
    $("diaSeries").textContent=seriesDe(d);

    var prox=proximoPendiente(i,pasos);
    var cont=$("diaPasos"); cont.innerHTML="";
    var faseActual="";

    pasos.forEach(function(p,k){
      if(p.fase!==faseActual){
        faseActual=p.fase;
        var h=document.createElement("div");
        h.className="fase";
        h.innerHTML='<span class="t">'+esc(faseActual)+'</span><span class="l"></span>';
        cont.appendChild(h);
        var wrap=document.createElement("div");
        wrap.className="exlist";
        wrap.id="fase"+k;
        cont.appendChild(wrap);
      }
      var lista=cont.lastElementChild;
      var hecho=completo(i,k,pasos);
      var hechas=hechasDe(i,k);
      var meta=metaDe(p);
      var bloqueado = !hecho && prox>=0 && k>prox;
      var b=document.createElement("button");
      b.type="button";
      b.className="exrow"+(p.tipo!=="ejercicio"?" cardio":"")+
        (hecho?" hecho":(k===prox?" next":(bloqueado?" bloq":"")));

      var sub, right, vc="";
      if(p.tipo==="ejercicio"){
        var e=p.dato;
        vc = e.variantes.length>1 ? '<span class="vcount">'+e.variantes.length+'</span>' : '';
        sub = hecho ? 'Completado'
          : esc(e.grupo)+(hechas>0?' · '+hechas+'/'+meta+' series':'')+(e.nota?' · '+esc(e.nota):'');
        right = hecho
          ? '<span class="exvol" style="color:var(--done-lt);display:flex;align-items:center">'+CHK+'</span>'
          : '<span class="exvol tnum">'+e.series+'×'+esc(e.reps)+'</span>';
      } else {
        sub = hecho ? 'Completado' : (p.dato.segundos
          ? 'Movilidad de hombro'+(hechas>0?' · '+hechas+'/'+meta+' series':'')
          : esc(p.dato.detalle||p.fase));
        right = hecho
          ? '<span class="exvol" style="color:var(--done-lt);display:flex;align-items:center">'+CHK+'</span>'
          : (p.dato.minutos
              ? '<span class="exvol tnum">'+p.dato.minutos+' min</span>'
              : (p.dato.segundos
                  ? '<span class="exvol tnum">'+p.dato.series+'×'+p.dato.segundos+' s</span>'
                  : '<span class="exvol" style="font-size:15px;color:var(--muted)">—</span>'));
      }
      if(bloqueado){
        sub='Se habilita al terminar el paso '+(prox+1);
        right='<span class="exvol" style="color:rgba(255,255,255,.3);display:flex;align-items:center">'+
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>';
      }
      b.innerHTML='<span class="exnum">'+(k+1)+'</span>'+
        '<span class="exname"><b>'+esc(p.dato.nombre)+vc+'</b><span>'+sub+'</span></span>'+right;
      if(bloqueado){
        b.disabled=true;
        b.setAttribute("aria-label",p.dato.nombre+", bloqueado hasta terminar el paso anterior");
      } else {
        b.addEventListener("click",function(){abrirPaso(k);});
      }
      lista.appendChild(b);
    });

    $("diaDone").innerHTML = (prox===-1)
      ? '<div class="diadone">'+
          '<span style="flex:none;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:10px;background:rgba(62,158,120,.22);color:var(--done-lt)">'+CHK+'</span>'+
          '<span style="flex:1;min-width:0">'+
            '<span style="display:block;font-size:13.5px;font-weight:800;color:var(--done-lt)">Sesión completa</span>'+
            '<span style="display:block;font-size:12px;color:var(--muted2);margin-top:2px">Los '+pasos.length+' pasos están hechos, bicicleta incluida.</span>'+
          '</span></div>'
      : '';
    var hay=false; pasos.forEach(function(_,k){ if(hechasDe(i,k)>0){hay=true;} });
    if(hay){
      $("diaDone").insertAdjacentHTML("beforeend",'<button class="reset" type="button" id="btnReset">Reiniciar este día</button>');
      $("btnReset").addEventListener("click",function(){
        pasos.forEach(function(_,k){ delete prog[key(i,k)]; });
        guardarProg(); abrirDia(i);
      });
    }
    ir("dia");
  }

  /* ---------- paso ---------- */
  function abrirPaso(k){
    pasoIdx=k; varIdx=0;
    pararTimer();
    pintarPaso();
    ir("paso");
  }

  function pintarPaso(){
    var p=pasos[pasoIdx];
    var v=p.variantes[varIdx];
    var esEj=p.tipo==="ejercicio";
    var esCardio=p.tipo==="cardio";

    $("ejImg0").src=v.imgs[0];
    $("ejImg1").src=v.imgs[1]||v.imgs[0];
    $("ejPos").textContent=(pasoIdx+1)+" / "+pasos.length;
    $("ejNombre").textContent=p.dato.nombre;

    $("ejIcon").innerHTML = esEj
      ? '<span class="kindicon">'+ICO_PESA+'</span>'
      : '<span class="kindicon amber">'+(esCardio?ICO_BICI:ICO_MOV)+'</span>';
    $("ejKicker").textContent = esEj
      ? (p.dato.grupo+" · "+(EQ[v.equipment]||v.equipment||""))
      : (p.fase+" · "+(esCardio?"Cardio":"Movilidad"));

    var st=$("ejStats");
    var serieMov = !esEj && !esCardio && !!p.dato.segundos;
    st.classList.toggle("wide",!esEj && !serieMov);
    if(esEj){
      st.innerHTML=
        '<div><div class="k">Series</div><div class="v tnum">'+p.dato.series+'</div></div>'+
        '<div><div class="k">Reps</div><div class="v tnum">'+esc(p.dato.reps)+'</div></div>'+
        '<div class="hot"><div class="k">Descanso</div><div class="v tnum">2:00</div></div>';
    } else if(esCardio){
      st.innerHTML=
        '<div><div class="k">Duración</div><div class="v tnum">'+p.dato.minutos+':00</div></div>'+
        '<div><div class="k">Fase</div><div class="v sm">'+esc(p.fase)+'</div></div>'+
        '<div><div class="k">Tipo</div><div class="v sm">Cardio</div></div>';
    } else if(serieMov){
      st.innerHTML=
        '<div><div class="k">Series</div><div class="v tnum">'+p.dato.series+'</div></div>'+
        '<div><div class="k">Tiempo</div><div class="v tnum">'+p.dato.segundos+' s</div></div>'+
        '<div class="hot"><div class="k">Zona</div><div class="v sm" style="color:#FF4A3F">Hombro</div></div>';
    } else {
      st.innerHTML=
        '<div><div class="k">Fase</div><div class="v sm">'+esc(p.fase)+'</div></div>'+
        '<div><div class="k">Zona</div><div class="v sm">Hombro</div></div>'+
        '<div><div class="k">Tipo</div><div class="v sm">Movilidad</div></div>';
    }

    var vt=$("ejVtabs");
    if(esEj && p.dato.variantes.length>1){
      vt.hidden=false; vt.innerHTML="";
      p.dato.variantes.forEach(function(vv,i){
        var b=document.createElement("button");
        b.type="button"; b.className="vtab"+(i===varIdx?" on":"");
        b.textContent=vv.desc||vv.nombre;
        b.addEventListener("click",function(){varIdx=i;pintarPaso();});
        vt.appendChild(b);
      });
    } else { vt.hidden=true; vt.innerHTML=""; }

    var nota=$("ejNota");
    if(esEj && p.dato.nota){
      nota.hidden=false;
      nota.innerHTML='<span style="flex:none;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:rgba(255,59,48,.22)">'+
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF6A60" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 11l6 6 6-6"/></svg></span>'+
        '<span style="flex:1;min-width:0">'+
          '<span style="display:block;font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#FF8A82">'+esc(p.dato.nota)+'</span>'+
          '<span style="display:block;font-size:12.5px;color:var(--muted2);margin-top:4px;line-height:1.4">'+
            (p.dato.nota==="drop sets"
              ? 'Llegás al fallo, bajás el peso sin descansar y seguís. Las '+p.dato.series+' series van así.'
              : 'En este ejercicio llegás al fallo en cada serie.')+'</span></span>';
    } else { nota.hidden=true; }

    $("ejPri").textContent=esLista(v.primary);
    $("ejSec").innerHTML=(v.secondary||[]).slice(0,2).map(function(n){return esc(ES[n]||n);}).join("<br>")||"—";
    var p1=expand(v.primary), p2=expand(v.secondary);
    polys.forEach(function(el){
      var t=el.getAttribute("data-m");
      el.classList.remove("p1","p2");
      if(p1[t]){el.classList.add("p1");} else if(p2[t]){el.classList.add("p2");}
    });

    pintarAbajo();
  }

  function pintarAbajo(){
    var p=pasos[pasoIdx];
    var n=hechasDe(diaIdx,pasoIdx);
    var meta=metaDe(p);
    var hecho=n>=meta;
    var head=$("ejSetsHead"), g=$("ejSets"), f=$("ejFooter");
    f.innerHTML="";

    if(p.tipo==="ejercicio"){
      head.hidden=false;
      var e=p.dato;
      g.style.gridTemplateColumns="repeat("+Math.min(e.series,4)+",minmax(0,1fr))";
      g.innerHTML="";
      for(var i=0;i<e.series;i++){
        var b=document.createElement("button");
        b.type="button";
        var prox=(i===n);
        b.className="setbtn"+(i<n?" done":(prox?" next":""));
        b.innerHTML=(i+1)+(i<n?'<span class="chk">'+CHK+'</span>':"");
        if(i<n||!prox){ b.disabled=true; }
        else { b.addEventListener("click",marcarSerie); }
        b.setAttribute("aria-label", i<n?("Serie "+(i+1)+" hecha"):(prox?("Marcar serie "+(i+1)):("Serie "+(i+1)+", todavía no")));
        g.appendChild(b);
      }
      $("ejProg").textContent=n+" de "+e.series;
      $("ejSetsLabel").textContent=hecho?"Series completas":"Marcá la serie "+(n+1);
    } else {
      var crono=serieCrono(p);
      if(crono){
        head.hidden=false;
        g.style.gridTemplateColumns="repeat("+Math.min(p.dato.series,4)+",minmax(0,1fr))";
        g.innerHTML="";
        for(var j=0;j<p.dato.series;j++){
          var bb=document.createElement("button");
          bb.type="button"; bb.disabled=true;
          bb.className="setbtn"+(j<n?" done":(j===n?" next":""));
          bb.innerHTML=(j+1)+(j<n?'<span class="chk">'+CHK+'</span>':"");
          g.appendChild(bb);
        }
        $("ejProg").textContent=n+" de "+p.dato.series;
        $("ejSetsLabel").textContent=hecho?"Series completas":"Serie "+(n+1)+" de "+p.dato.series;
      } else {
        head.hidden=true;
        g.innerHTML="";
      }
      if(!hecho){
        if(conTimer(p)){
          var total=segundosDe(p);
          var falta = (restante>0 && restante<totalTimer);
          var txtIni = crono ? "Empezar serie "+(n+1)+" · "+p.dato.segundos+" s" : "Empezar "+p.dato.minutos+" min";
          var reglaT = crono ? "Cada serie dura "+p.dato.segundos+" segundos" : "Los "+p.dato.minutos+" minutos son obligatorios";
          var reglaD = crono
            ? "El paso siguiente se habilita recién cuando terminás las "+p.dato.series+" series. El reloj tiene que llegar a 0:00."
            : "El paso siguiente se habilita recién cuando el reloj llega a 0:00. No se puede adelantar.";
          f.innerHTML='<button class="bigbtn roja" type="button" id="btnAccion">'+
            (corriendo ? "Pausar" : (falta ? "Seguir · faltan "+mmss(restante) : txtIni))+
            '</button>'+
            '<div class="regla"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5B13D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'+
            '<div><b>'+reglaT+'</b><span>'+reglaD+'</span></div></div>'+
            (MODO_PRUEBA ? '<button class="pruebabtn" type="button" id="btnPrueba"><i>Solo pruebas</i>Saltar este paso</button>' : '');
        } else {
          f.innerHTML='<button class="bigbtn roja" type="button" id="btnAccion">Marcar como hecho</button>';
        }
      }
    }

    if(hecho){
      var hayOtro=pasoIdx<pasos.length-1;
      f.innerHTML='<button class="bigbtn verde" type="button" id="btnNext">'+
        (hayOtro?'Siguiente paso<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>'
                :'Terminar la sesión'+CHK)+'</button>';
      $("btnNext").addEventListener("click",function(){
        pararTimer();
        if(hayOtro){ abrirPaso(pasoIdx+1); } else { abrirDia(diaIdx); }
      });
      return;
    }

    if(conTimer(p)){
      $("btnAccion").addEventListener("click",function(){
        if(corriendo){ pausarTimer(); } else { arrancarCardio(); }
      });
      var bp=$("btnPrueba");
      if(bp){ bp.addEventListener("click",function(){ completarPaso(); }); }
    } else if(p.tipo!=="ejercicio"){
      $("btnAccion").addEventListener("click",function(){ completarPaso(); });
    }
  }

  function completarPaso(){
    pararTimer();
    prog[key(diaIdx,pasoIdx)]=metaDe(pasos[pasoIdx]);
    guardarProg();
    pintarAbajo();
  }

  function marcarSerie(){
    var e=pasos[pasoIdx].dato;
    var n=hechasDe(diaIdx,pasoIdx);
    if(n>=e.series){return;}
    prog[key(diaIdx,pasoIdx)]=n+1;
    guardarProg();
    pintarAbajo();
    if(n+1<e.series){ arrancarDescanso(); } else { pararTimer(); }
  }

  /* ---------- cronómetros ---------- */
  function mostrarTimer(on,verde){
    $("ejTimer").hidden=!on;
    $("ejBody").hidden=on;
    $("ejTimer").classList.toggle("verde",!!verde);
  }
  function pintarTimer(){
    $("tReloj").textContent=mmss(Math.max(0,restante));
    $("tBar").style.width=Math.max(0,Math.round((restante/totalTimer)*100))+"%";
  }
  function botonesTimer(){
    var b=$("tBtns");
    if(modo==="descanso"){
      b.innerHTML='<button class="tbtn" type="button" id="tMas">+30 s</button>'+
                  '<button class="tbtn hot" type="button" id="tFin">Saltar</button>';
      $("tMas").addEventListener("click",function(){restante+=30;pintarTimer();});
      $("tFin").addEventListener("click",pararTimer);
    } else {
      b.innerHTML='<button class="tbtn amber" type="button" id="tMas">'+(corriendo?"Pausar":"Seguir")+'</button>';
      $("tMas").addEventListener("click",function(){
        if(corriendo){ pausarTimer(); } else { correr(); botonesTimer(); pintarAbajo(); }
      });
    }
  }
  function correr(){
    if(tick){clearInterval(tick);}
    corriendo=true;
    tick=setInterval(function(){
      restante--;
      if(restante<=0){
        clearInterval(tick); tick=null; corriendo=false;
        if(modo==="cardio"){ completarPaso(); }
        else if(modo==="serie"){
          var nn=hechasDe(diaIdx,pasoIdx)+1;
          pararTimer();
          prog[key(diaIdx,pasoIdx)]=nn; guardarProg();
          pintarAbajo();
        } else { pararTimer(); }
      } else { pintarTimer(); }
    },1000);
  }
  function arrancarDescanso(){
    modo="descanso"; totalTimer=DESCANSO; restante=DESCANSO;
    $("tLabel").textContent="Descansando";
    mostrarTimer(true,false); pintarTimer(); botonesTimer(); correr();
  }
  function arrancarCardio(){
    var p=pasos[pasoIdx], esS=serieCrono(p);
    modo=esS?"serie":"cardio"; totalTimer=segundosDe(p);
    if(restante<=0){ restante=totalTimer; }
    $("tLabel").textContent = esS
      ? "Serie "+(hechasDe(diaIdx,pasoIdx)+1)+" de "+p.dato.series
      : (p.fase==="Cierre"?"Bicicleta final":"Bicicleta inicial");
    mostrarTimer(true,true); pintarTimer(); correr(); botonesTimer();
    pintarAbajo();
  }
  function pausarTimer(){
    if(tick){clearInterval(tick);tick=null;}
    corriendo=false;
    botonesTimer();
    pintarAbajo();
  }
  function pararTimer(){
    if(tick){clearInterval(tick);tick=null;}
    corriendo=false; restante=0; modo="";
    mostrarTimer(false,false);
  }

  /* ---------- animación de 2 fotogramas ---------- */
  var FADE={hold0:420,down:620,hold1:420,up:620};
  var CICLO=FADE.hold0+FADE.down+FADE.hold1+FADE.up;
  function ease(x){return 0.5-0.5*Math.cos(Math.PI*x);}
  function fase(ms){
    var x=ms%CICLO;
    if(x<FADE.hold0){return 0;}
    x-=FADE.hold0;
    if(x<FADE.down){return ease(x/FADE.down);}
    x-=FADE.down;
    if(x<FADE.hold1){return 1;}
    x-=FADE.hold1;
    return 1-ease(x/FADE.up);
  }
  if(!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)){
    var t0=null, capa=$("ejImg1");
    requestAnimationFrame(function loop(now){
      if(t0===null){t0=now;}
      if(vista==="paso"){ capa.style.opacity=fase(now-t0); }
      requestAnimationFrame(loop);
    });
  }
